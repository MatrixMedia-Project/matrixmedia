apiVersion: v1
kind: Service
metadata:
  name: {{ include "livekit.fullname" . }}-rtc
  labels: {{- include "livekit.labels" . | nindent 4 }}
  {{- with .Values.service.rtc.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.rtc.type }}
  externalTrafficPolicy: {{ .Values.service.rtc.externalTrafficPolicy }}
  {{- with .Values.service.rtc.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  ports:
    - name: tcp-fallback
      port: {{ .Values.ports.tcpFallback }}
      targetPort: tcp-fallback
      protocol: TCP
{{- range $port := untilStep (int .Values.ports.rtcUdpStart) (int (add 1 (int .Values.ports.rtcUdpEnd))) 1 }}
    - name: rtc-{{ $port }}
      port: {{ $port }}
      targetPort: {{ $port }}
      protocol: UDP
{{- end }}
  selector: {{- include "livekit.selectorLabels" . | nindent 4 }}
