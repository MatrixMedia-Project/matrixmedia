# supervisord for the all-in-one try-it image. Every program is a `mm-allinone run`
# wrapper (infra/docker/allinone/mm-allinone.sh): it waits for what its process needs,
# reads its secrets, drops root and execs. Output goes to the container's stdout with a
# [name] prefix on each line.
#
# Start order is by priority (lower first) and supervisord stops in the reverse order, so
# nginx and mm-core go down before the databases they use.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisord.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[program:postgres]
command=/usr/local/bin/mm-allinone run postgres
priority=10
; SIGINT is Postgres's "fast" shutdown: roll back open transactions, exit cleanly.
stopsignal=INT
stopwaitsecs=30
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:synapse]
command=/usr/local/bin/mm-allinone run synapse
priority=20
stopwaitsecs=20
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:livekit]
command=/usr/local/bin/mm-allinone run livekit
priority=20
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mm-switch]
command=/usr/local/bin/mm-allinone run mm-switch
priority=20
; mm-switch flushes open recordings on SIGTERM within MM_SWITCH_SHUTDOWN_GRACE_SECS (8 s).
stopwaitsecs=15
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:fakestripe]
command=/usr/local/bin/mm-allinone run fakestripe
priority=20
; Runs only with demo payments on (MM_DEMO_MODE, exported by `mm-allinone start`).
autostart=%(ENV_MM_DEMO_MODE)s
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mm-core]
command=/usr/local/bin/mm-allinone run mm-core
priority=30
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/local/bin/mm-allinone run nginx
priority=40
; SIGQUIT is nginx's graceful shutdown.
stopsignal=QUIT
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; One-shot: creates the admin account on the first start, then prints the "ready" banner
; once mm-core answers. A failure is retried; a clean exit is final.
[program:bootstrap]
command=/usr/local/bin/mm-allinone bootstrap
priority=50
startsecs=0
autorestart=unexpected
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
