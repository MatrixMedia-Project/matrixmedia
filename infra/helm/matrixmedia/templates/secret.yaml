apiVersion: v1
kind: Secret
metadata:
  name: {{ include "matrixmedia.fullname" . }}
  labels:
    {{- include "matrixmedia.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.jwtSigningKey }}
  MM_JWT_SIGNING_KEY: {{ .Values.secrets.jwtSigningKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.adminToken }}
  MM_ADMIN_TOKEN: {{ .Values.secrets.adminToken | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.matrixAsToken }}
  MM_MATRIX_AS_TOKEN: {{ .Values.secrets.matrixAsToken | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.matrixHsToken }}
  MM_MATRIX_HS_TOKEN: {{ .Values.secrets.matrixHsToken | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.sfuApiKey }}
  MM_SFU_LIVEKIT_API_KEY: {{ .Values.secrets.sfuApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.sfuApiSecret }}
  MM_SFU_LIVEKIT_API_SECRET: {{ .Values.secrets.sfuApiSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.s3AccessKey }}
  MM_STORAGE_S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.s3SecretKey }}
  MM_STORAGE_S3_SECRET_KEY: {{ .Values.secrets.s3SecretKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.cdnSigningKey }}
  MM_CDN_SIGNING_KEY: {{ .Values.secrets.cdnSigningKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.stripeSecretKey }}
  MM_STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.stripePublishableKey }}
  MM_STRIPE_PUBLISHABLE_KEY: {{ .Values.secrets.stripePublishableKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.stripeWebhookSecret }}
  MM_STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.postgresUrl }}
  MM_POSTGRES_URL: {{ .Values.secrets.postgresUrl | b64enc | quote }}
  {{- end }}
