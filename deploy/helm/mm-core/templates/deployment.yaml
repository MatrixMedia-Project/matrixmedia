apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mm-core.fullname" . }}
  labels: {{- include "mm-core.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "mm-core.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels: {{- include "mm-core.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.migrations.enabled }}
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["matrixmedia", "migrate"]
          envFrom: {{- include "mm-core.envFrom" . | nindent 12 }}
          env: {{- include "mm-core.envMappings" . | nindent 12 }}
          # Reuse the main container's resources for the migrate init —
          # required because the tenant namespace ResourceQuota refuses
          # pods whose containers (init or main) don't declare both.
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      {{- end }}
      containers:
        - name: mm-core
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["matrixmedia", "serve"]
          envFrom: {{- include "mm-core.envFrom" . | nindent 12 }}
          env: {{- include "mm-core.envMappings" . | nindent 12 }}
          ports:
            - name: client
              containerPort: {{ .Values.ports.client }}
              protocol: TCP
            - name: admin
              containerPort: {{ .Values.ports.admin }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.ports.metrics }}
              protocol: TCP
          # Probes hit the public `.well-known` endpoint on the client port.
          # Admin `/_mm/admin/v1/health` requires AdminAuth (would 401 the
          # kubelet); wellknown is no-auth and exercises the HTTP stack.
          startupProbe:
            httpGet:
              path: /.well-known/matrix/matrixmedia
              port: client
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /.well-known/matrix/matrixmedia
              port: client
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /.well-known/matrix/matrixmedia
              port: client
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
        - name: data
          emptyDir:
            sizeLimit: 1Gi
