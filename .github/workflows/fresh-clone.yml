# Can someone who just cloned this repo actually start it?
#
# Everything else in CI runs against a warm tree with the toolchain already chosen. This
# job is the only one that answers the question a new contributor asks first, and the
# answer used to be no, twice over:
#
#   * `docker compose up` failed outright — element-call and sygnal join the external
#     `traefik` network, which does not exist on a machine that has never run the
#     production edge. Not a degraded start: nothing came up.
#   * Synapse exited on a fresh volume, because nothing ever ran its config `generate`
#     step. Existing installs only worked because a legacy volume already held the file.
#
# Both are now fixed (compose profiles + an idempotent synapse-init). This job exists so
# they cannot regress silently — the failure mode is invisible to anyone whose machine
# already has state.
#
# Uses no secrets, so it runs on forks.

name: fresh-clone

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request cancels that PR's older, now-superseded run of
# this workflow. The group carries the workflow name and the PR number, so other
# PRs and other workflows are never touched. Every other event (pushes to main or
# development, v* tags, workflow_dispatch) gets a group of its own run id, so it
# is never cancelled and never waits behind another run: a shared group would keep
# only one run pending and cancel the rest, even with cancel-in-progress off.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cold-start:
    name: clone → stack up
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Honour the pins the repo declares, rather than whatever the runner happens to ship.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: install just
        # Straight from the release download: install-action ships its own version
        # manifest. extractions/setup-just asked the GitHub releases API which version
        # to fetch, and that call answered 504 on six runs in a row (2026-11-08),
        # failing this required check on a docs-only PR. The justfile needs a recent
        # just ([doc] attributes), so Ubuntu's packaged 1.21 would not do.
        id: install-just
        uses: taiki-e/install-action@v2
        with:
          tool: just
        continue-on-error: true
      # install-action still downloads from github.com (github.com/casey/just/releases/
      # download/…), and github.com itself answered 504 intermittently that day. If it
      # fails, install the same just release from PyPI, an install channel just's own
      # README lists.
      - name: install just (fallback from PyPI)
        id: just-pypi
        if: steps.install-just.outcome == 'failure'
        run: |
          pipx install rust-just
          bin="$(pipx environment --value PIPX_BIN_DIR)"
          "$bin/just" --version
          echo "$bin" >> "$GITHUB_PATH"

      - name: install bats
        # `just doctor` hard-gates on every tool `just ci` invokes (see the
        # doctor recipe) — bats runs the deploy/installer suite. The runner
        # image doesn't ship it.
        run: sudo apt-get update -q && sudo apt-get install -y -q bats
      - name: just doctor
        run: just doctor

      # The real test. `docker compose up` with no profile must not reference the external
      # traefik network, and Synapse must generate its own config on an empty volume.
      - name: cold start the dev stack
        run: just dev

      - name: Synapse must answer on a volume that has never existed
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8008/_matrix/client/versions >/dev/null 2>&1; then
              echo "Synapse is up:"
              curl -fsS http://localhost:8008/_matrix/client/versions
              exit 0
            fi
            sleep 5
          done
          echo "::error::Synapse never came up on a fresh volume — the cold-start path is broken again."
          docker compose -f infra/docker/docker-compose.yml logs synapse-init synapse
          exit 1

      - name: seed a user
        run: just seed ci-user ci-password

      - name: stack logs (on failure)
        if: failure()
        run: docker compose -f infra/docker/docker-compose.yml logs --tail=80

      # Without just nothing was started, so skip instead of failing a second time with
      # "just: command not found" and burying the real error.
      - name: tear down
        if: always() && (steps.install-just.outcome == 'success' || steps.just-pypi.outcome == 'success')
        run: just dev-reset
