apiVersion: v1
kind: Service
metadata:
  name: {{ include "livekit.fullname" . }}
  labels: {{- include "livekit.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.signaling.type }}
  ports:
    - name: signaling
      port: {{ .Values.ports.signaling }}
      targetPort: signaling
      protocol: TCP
  selector: {{- include "livekit.selectorLabels" . | nindent 4 }}
