# mm-postgres host-based auth -- extremely restrictive.
# Only mm-core on the mm-db-net network, and mm-media-worker on mm-ads-net, can connect.
# TYPE  DATABASE      USER        ADDRESS          METHOD
local   all           postgres                     trust
# mm-core on mm-db-net subnet (172.28.0.0/24)
host    matrixmedia   mm_app      172.28.0.0/24    scram-sha-256
host    matrixmedia   mm_admin    172.28.0.0/24    scram-sha-256
# mm-media-worker on mm-ads-net (172.29.0.0/24): its only network, shared with mm-postgres
host    matrixmedia   mm_media_worker    172.29.0.0/24    scram-sha-256
# Reject everything else
host    all           all         0.0.0.0/0        reject
host    all           all         ::/0             reject
