name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  build-binary:
    name: Build release binary
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: matrixmedia-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: matrixmedia-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: matrixmedia-darwin-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: matrixmedia-darwin-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation deps (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p mm-server
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/mm-server dist/${{ matrix.name }}
          cd dist && tar czf ${{ matrix.name }}.tar.gz ${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.tar.gz

  build-docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/mm-core:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/mm-core:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    name: Build web packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build widget
        run: |
          cd web/packages/mm-widget
          npm ci
          npm run build
          cd ../../..
          tar czf mm-widget.tar.gz -C web/packages/mm-widget/dist .

      - name: Build dashboard
        run: |
          cd web/packages/mm-dashboard
          npm ci
          npm run build
          cd ../../..
          tar czf mm-dashboard.tar.gz -C web/packages/mm-dashboard/dist .

      - name: Build viewer
        run: |
          cd web/packages/mm-viewer
          npm ci
          npm run build
          cd ../../..
          tar czf mm-viewer.tar.gz -C web/packages/mm-viewer/dist .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-packages
          path: "*.tar.gz"

  create-release:
    name: Create GitHub Release
    needs: [build-binary, build-docker, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          {
            echo "changelog<<EOF"
            git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges
            echo
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changelog }}

            ## Docker Images
            - `ghcr.io/${{ github.repository }}/mm-core:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository }}/mm-core:latest`

            ## Installation
            See `docs/quickstart.md` for installation instructions.
