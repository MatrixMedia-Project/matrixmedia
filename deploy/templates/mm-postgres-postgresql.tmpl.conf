# mm-postgres config -- dedicated monetization database for MatrixMedia
# Network-isolated, SCRAM auth, resource-limited.
listen_addresses = '*'
port = 5432

password_encryption = scram-sha-256

max_connections = 50
superuser_reserved_connections = 3

# SSL disabled: container-to-container on isolated bridge network.
ssl = off

# Logging to stderr -- Docker captures it.
logging_collector = off
log_connections = on
log_disconnections = on
log_statement = 'ddl'
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_min_duration_statement = 500
log_lock_waits = on

# Memory tuning (512 MB container limit)
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 256MB

# Security
row_security = on
