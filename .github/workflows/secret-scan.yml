name: secret-scan

# Hardening gate: fail any PR/push that introduces prod infra strings or
# secret material into the PUBLIC repo. Prod IPs, internal hostnames, tokens
# and private keys live ONLY in the private matrixmedia-ops repo / NEW box.
on:
  pull_request:
  push:
    branches: [main, development]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: scrub check (added lines only)
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          RANGE="$BASE...${{ github.sha }}"
          git diff -U0 "$RANGE" -- . ':(exclude)matrixmedia-ops/**' | grep '^+' | grep -v '^+++' > added.txt || true
          PAT='ssh\.mm\.internal|195\.211\.|10\.77\.[0-9]|ghp_[A-Za-z0-9]+|gho_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+|-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----|xox[bpas]-'
          if grep -Ei "$PAT" added.txt; then
            echo "::error::added lines contain infra/secret material — move it to matrixmedia-ops"
            exit 1
          fi
          echo "secret-scan clean"
