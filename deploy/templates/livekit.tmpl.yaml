port: 7880

redis:
  address: lk-redis:6379
  password: ${REDIS_PASSWORD}

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50020
  use_external_ip: false
  node_ip: ${MM_PUBLIC_IP}

turn:
  enabled: true
  domain: ${MM_DOMAIN}
  cert_file: ""
  key_file: ""
  tls_port: 5349
  udp_port: 3478
  external_tls: true

keys:
  ${LK_API_KEY}: ${LK_API_SECRET}

webhook:
  api_key: ${LK_API_KEY}
  urls:
    - "http://mm-core:6167/_mm/internal/v1/sfu/webhook"

room:
  auto_create: true
  empty_timeout: 300

logging:
  level: info
