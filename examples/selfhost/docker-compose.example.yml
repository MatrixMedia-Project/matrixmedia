# MatrixMedia — minimal self-host example (community reference)
#
# This is a STARTING POINT, not a turnkey installer. It shows how the
# MatrixMedia engine wires together with a Matrix homeserver, a LiveKit SFU,
# and Postgres using plain environment variables. You bring your own:
#   - reverse proxy + TLS (Caddy / Traefik / nginx) in front of these services
#   - Matrix homeserver config (homeserver.yaml) + appservice registration
#   - secret values (see .env.example; generate strong random values)
#
# Copy .env.example to .env, fill it in, then: docker compose up -d
# Everything below is configured purely through ${VARS} — no hardcoded hosts.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: matrixmedia
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mm"]
      interval: 10s
      timeout: 5s
      retries: 5

  synapse:
    image: matrixdotorg/synapse:latest
    restart: unless-stopped
    # Provide your own homeserver.yaml (server_name=${MM_DOMAIN}, a Postgres
    # database section, and the MatrixMedia appservice registration file).
    volumes:
      - synapse-data:/data
      - ./homeserver.yaml:/data/homeserver.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    # Provide a livekit.yaml with keys: { ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET} }
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  mm-core:
    image: ${MM_REGISTRY:-ghcr.io/matrixmedia}/matrixmedia-mm-core:${MM_VERSION:-latest}
    restart: unless-stopped
    command: ["serve"]
    environment:
      MM_MATRIX_SERVER_NAME: ${MM_DOMAIN}
      MM_MATRIX_HOMESERVER_URL: http://synapse:8008
      MM_MATRIX_AS_TOKEN: ${MM_AS_TOKEN}
      MM_MATRIX_HS_TOKEN: ${MM_HS_TOKEN}
      MM_DATABASE_URL: postgres://mm:${POSTGRES_PASSWORD}@postgres:5432/matrixmedia
      MM_JWT_SIGNING_KEY: ${MM_JWT_SIGNING_KEY}
      MM_ADMIN_TOKEN: ${MM_ADMIN_TOKEN}
      MM_SFU_LIVEKIT_URL: http://livekit:7880
      MM_SFU_LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      MM_SFU_LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      MM_SWITCH_URL: http://mm-switch:7890
      MM_SWITCH_AUTH_SECRET: ${MM_SWITCH_AUTH_SECRET}
      MM_SERVER_PUBLIC_URL: https://matrix.${MM_DOMAIN}
      # Monetization is optional; configure Stripe / Lightning per the docs.
      MM_MONETIZATION_ENABLED: ${MM_MONETIZATION_ENABLED:-false}
    depends_on:
      - synapse
      - livekit

  mm-switch:
    image: ${MM_REGISTRY:-ghcr.io/matrixmedia}/matrixmedia-mm-switch:${MM_SWITCH_VERSION:-latest}
    restart: unless-stopped
    environment:
      MM_SWITCH_LISTEN: 0.0.0.0:7890
      MM_SWITCH_AUTH_SECRET: ${MM_SWITCH_AUTH_SECRET}
      MM_SWITCH_PUBLIC_IP: ${MM_PUBLIC_IP}

volumes:
  pgdata:
  synapse-data:
