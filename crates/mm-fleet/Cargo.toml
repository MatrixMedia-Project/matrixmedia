[package]
name = "mm-fleet"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mm-core = { workspace = true }
mm-db = { workspace = true }

async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
# check_endpoint parses the sealed endpoint; already in the lockfile via reqwest.
url = "2"
# Provider tokens are sealed in the browser to the runner's key (HPKE, RFC 9180).
# hpke's default `getrandom` feature supplies the OS RNG (`getrandom::SysRng`), so no
# direct rand_core dependency is needed.
hpke = { version = "0.14", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
sha2 = { workspace = true }
hex = { workspace = true }
# The test-boot token (test_boot.rs): rand 0.9's `rng()` is the ChaCha-based, OS-seeded thread RNG.
rand = { workspace = true }
# The runner's /metrics families (metrics.rs); registered by the runner only.
prometheus = { workspace = true }

[features]
# Seams that exist only so tests can point a client at a stand-in server (they skip the
# public-address check on a sealed endpoint). Never enabled in production builds; the
# self dev-dependency below turns it on for this crate's own tests, and a consumer's tests
# turn it on in their dev-dependencies.
test-support = []

[dev-dependencies]
# Lets this crate's own `tests/*.rs` and unit tests use the `test-support` seams (the same
# self-path dev-dependency trick mm-db uses).
mm-fleet = { path = ".", features = ["test-support"] }
# test_support is feature-gated in mm-db and never enabled in production builds;
# consumers turn it on here.
mm-db = { workspace = true, features = ["test-support"] }
# A stand-in Scaleway for the provider tests: the shapes are copied from the
# published SDK, so a drift in the real API shows up as a parse failure here.
axum = { workspace = true }
