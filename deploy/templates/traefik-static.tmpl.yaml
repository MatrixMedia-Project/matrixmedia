log:
  level: INFO
  format: logfmt

accessLog:
  format: json
  bufferingSize: 50

api:
  dashboard: false
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http2:
      maxConcurrentStreams: 250

certificatesResolvers:
  production:
    acme:
      email: ${ACME_EMAIL}
      storage: /acme/acme.json
      httpChallenge:
        entryPoint: web

providers:
  file:
    filename: /opt/mm/config/traefik-dynamic.yaml
    watch: true
  docker:
    exposedByDefault: false
    endpoint: "unix:///var/run/docker.sock"
    network: mm_network
    watch: true
