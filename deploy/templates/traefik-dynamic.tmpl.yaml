http:
  routers:
    # ── Matrix / Synapse catch-all ─────────────────────────────────────────────
    matrix-synapse:
      rule: "Host(`matrix.${MM_DOMAIN}`) && !PathPrefix(`/_mm`) && !PathPrefix(`/mm/v1`) && !PathPrefix(`/livekit`) && !PathPrefix(`/lk-jwt`)"
      entryPoints:
      - websecure
      service: matrix-synapse
      middlewares:
      - security-headers
      tls:
        certResolver: production

    # ── Matrix well-known (apex domain → mm-web) ───────────────────────────────
    matrix-wellknown-server-override:
      rule: "Host(`${MM_DOMAIN}`) && Path(`/.well-known/matrix/server`)"
      priority: 250
      entryPoints:
      - websecure
      service: mm-web
      middlewares:
      - security-headers
      tls:
        certResolver: production

    # ── Matrix well-known (matrix subdomain → synapse) ────────────────────────
    matrix-wellknown-matrix:
      rule: "Host(`matrix.${MM_DOMAIN}`) && PathPrefix(`/.well-known/matrix/`)"
      entryPoints:
      - websecure
      service: matrix-synapse
      middlewares:
      - security-headers
      tls:
        certResolver: production

    # ── MatrixMedia well-known ────────────────────────────────────────────────
    mm-wellknown-matrixmedia:
      rule: "Host(`matrix.${MM_DOMAIN}`) && PathPrefix(`/.well-known/matrixmedia/`)"
      priority: 200
      entryPoints:
      - websecure
      service: mm-client
      middlewares:
      - security-headers
      tls:
        certResolver: production

    # ── mm-web static assets & SPAs ──────────────────────────────────────────
    mm-web:
      rule: "Host(`matrix.${MM_DOMAIN}`) && (PathPrefix(`/_mm/dashboard`) || PathPrefix(`/_mm/viewer`) || PathPrefix(`/_mm/demo`) || PathPrefix(`/_mm/live`) || PathPrefix(`/_mm/studio`) || PathPrefix(`/_mm/operator`) || PathPrefix(`/_mm/playground`) || PathPrefix(`/_mm/federation`) || PathPrefix(`/_mm/mobile`) || PathPrefix(`/_mm/hub`) || PathPrefix(`/_mm/chat`) || PathPrefix(`/_mm/landing`) || PathPrefix(`/_mm/brand`) || PathPrefix(`/_mm/recordings`) || PathPrefix(`/_mm/ads`))"
      entryPoints:
      - websecure
      service: mm-web
      middlewares:
      - security-headers
      tls:
        certResolver: production
      priority: 100

    # ── Landing page redirect ─────────────────────────────────────────────────
    mm-landing:
      rule: "Host(`matrix.${MM_DOMAIN}`) && Path(`/`)"
      service: mm-web
      entryPoints:
      - websecure
      middlewares:
      - mm-landing-rewrite
      - security-headers
      tls:
        certResolver: production
      priority: 200

    # ── mm-core client (/_mm/client, /_mm/webhooks) ───────────────────────────
    # /_mm/internal (the Alertmanager webhook) is deliberately not routed: it is
    # reached over the docker network only.
    mm-client:
      rule: "Host(`matrix.${MM_DOMAIN}`) && PathPrefix(`/_mm/client`)"
      entryPoints:
      - websecure
      service: mm-client
      middlewares:
      - security-headers
      tls:
        certResolver: production

    mm-webhooks:
      rule: "Host(`matrix.${MM_DOMAIN}`) && PathPrefix(`/_mm/webhooks`)"
      entryPoints:
      - websecure
      service: mm-client
      middlewares:
      - security-headers
      tls:
        certResolver: production

    # ── mm-core fleet viewer proxy (/_mm/fleet) ──────────────────────────────
    # The Flutter SDK polls GET /_mm/fleet/v1/streams/{id}/api/viewers with the
    # MM session token for live viewer counts (FR-349b closed the direct
    # switch viewer list, which now needs the server role). The proxy handlers
    # are Matrix-authenticated and the count endpoint returns a bare number —
    # no viewer ids — so this publishes nothing unauthenticated, same posture
    # as /_mm/client. Keep in lockstep with switch_proxy.rs mounts.
    mm-fleet:
      rule: "Host(`matrix.${MM_DOMAIN}`) && PathPrefix(`/_mm/fleet`)"
      entryPoints:
      - websecure
      service: mm-client
      middlewares:
      - security-headers
      tls:
        certResolver: production

    # ── mm-core admin ─────────────────────────────────────────────────────────
    mm-admin:
      rule: "Host(`matrix.${MM_DOMAIN}`) && PathPrefix(`/_mm/admin`)"
      entryPoints:
      - websecure
      service: mm-admin
      middlewares:
      - security-headers
      tls:
        certResolver: production

    # ── mm-core public API (/mm/v1) ───────────────────────────────────────────
    mm-public:
      rule: "Host(`matrix.${MM_DOMAIN}`) && PathPrefix(`/mm/v1`)"
      entryPoints:
      - websecure
      service: mm-client
      middlewares:
      - security-headers
      tls:
        certResolver: production

    # ── LiveKit proxy ─────────────────────────────────────────────────────────
    mm-livekit:
      rule: "Host(`matrix.${MM_DOMAIN}`) && PathPrefix(`/livekit`)"
      entryPoints:
      - websecure
      service: mm-livekit
      middlewares:
      - security-headers
      - livekit-strip
      tls:
        certResolver: production

    # ── Element Call (call subdomain) ─────────────────────────────────────────
    # FILE-routed, not docker-labelled: the compose service sets
    # traefik.enable=false, so this file is the one place call routing lives and
    # it behaves identically whatever Docker version the host runs (cutover: NEW
    # stays on Docker 29, no downgrade). Keep in lockstep with the comment on the
    # element-call service in deploy/docker-compose.tmpl.yml.
    element-call:
      rule: "Host(`call.${MM_DOMAIN}`)"
      entryPoints:
      - websecure
      service: element-call
      middlewares:
      - security-headers
      tls:
        certResolver: production

    # ── lk-jwt-service ────────────────────────────────────────────────────────
    # Same file-routing as element-call. Priority 200 keeps it ahead of the
    # Synapse catch-all (which excludes /lk-jwt explicitly — keep both in
    # lockstep), and lk-jwt-strip reproduces the old label middleware.
    lk-jwt:
      rule: "Host(`matrix.${MM_DOMAIN}`) && PathPrefix(`/lk-jwt`)"
      priority: 200
      entryPoints:
      - websecure
      service: lk-jwt-service
      middlewares:
      - security-headers
      - lk-jwt-strip
      tls:
        certResolver: production

    # ── LNbits ────────────────────────────────────────────────────────────────
    lnbits:
      rule: "Host(`matrix.${MM_DOMAIN}`) && PathPrefix(`/_mm/lnbits`)"
      entryPoints:
      - websecure
      service: lnbits
      middlewares:
      - lnbits-strip
      - security-headers
      tls:
        certResolver: production

    # ── mm-switch ─────────────────────────────────────────────────────────────
    # /metrics and /health are unauthenticated operational endpoints: excluded from
    # the internet-facing route (internal scrapers reach mm-switch:7890 directly).
    # Keep this rule in lockstep with the mm-switch Traefik label in
    # deploy/docker-compose.tmpl.yml.
    # /api/viewers was public for the viewer-count UI. DECIDED 2026-09-24 (FR-349b):
    # it is now authenticated at the APPLICATION layer via
    # MM_SWITCH_PRIVATE_VIEWER_LIST, because viewer ids embed Matrix user ids and
    # this route publishes /_mm/switch/** to the internet. The path stays on this
    # router on purpose: mm-core calls it WITH a server token, so excluding it here
    # would break the operator console, while the app-layer gate 401s everyone else.
    mm-switch:
      rule: "Host(`matrix.${MM_DOMAIN}`) && PathPrefix(`/_mm/switch`) && !Path(`/_mm/switch/metrics`) && !Path(`/_mm/switch/health`)"
      entryPoints:
      - websecure
      service: mm-switch
      middlewares:
      - mm-switch-strip
      - security-headers
      tls:
        certResolver: production

    # (grafana and sygnal routes removed — out-of-scope services)

  middlewares:
    security-headers:
      headers:
        frameDeny: true
        sslRedirect: true
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        stsSeconds: 31536000

    lnbits-strip:
      stripPrefix:
        prefixes:
        - /_mm/lnbits

    mm-switch-strip:
      stripPrefix:
        prefixes:
        - /_mm/switch

    livekit-strip:
      stripPrefix:
        prefixes:
        - /livekit

    lk-jwt-strip:
      stripPrefix:
        prefixes:
        - /lk-jwt

    mm-landing-rewrite:
      replacePath:
        path: /_mm/landing/

  services:
    matrix-synapse:
      loadBalancer:
        servers:
        - url: http://synapse:8008
        passHostHeader: true

    mm-client:
      loadBalancer:
        servers:
        - url: http://mm-core:6167
        passHostHeader: true

    mm-admin:
      loadBalancer:
        servers:
        - url: http://mm-core:6168
        passHostHeader: true

    mm-livekit:
      loadBalancer:
        servers:
        - url: http://livekit:7880
        passHostHeader: true

    element-call:
      loadBalancer:
        servers:
        - url: http://element-call:8080
        passHostHeader: true

    lk-jwt-service:
      loadBalancer:
        servers:
        - url: http://lk-jwt-service:8080
        passHostHeader: true

    mm-web:
      loadBalancer:
        servers:
        - url: http://mm-web:80
        passHostHeader: true

    lnbits:
      loadBalancer:
        servers:
        - url: http://lnbits:5000
        passHostHeader: true

    mm-switch:
      loadBalancer:
        servers:
        - url: http://mm-switch:7890
        passHostHeader: true
