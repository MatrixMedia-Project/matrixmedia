[package]
name = "mm-db"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mm-core = { workspace = true }

sha2 = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }

[features]
# Shared helpers for Postgres-backed integration tests (fail-loud DB guard).
# Never enabled in production builds; consumers turn it on in dev-dependencies.
test-support = []

[dev-dependencies]
# Lets this crate's own `tests/*.rs` (and in-crate unit tests) use
# `mm_db::test_support` — the standard self-path dev-dependency trick.
mm-db = { path = ".", features = ["test-support"] }
