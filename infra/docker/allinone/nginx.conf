# nginx for the all-in-one try-it image: the container's one HTTP port. It does what
# Traefik and the mm-web nginx do in the production stack (deploy/templates/
# traefik-dynamic.tmpl.yaml, deploy/templates/nginx.tmpl.conf), on plain HTTP:
# MatrixMedia paths go to mm-core, mm-switch and LiveKit, the SPAs are served from the
# image, and everything else is Synapse.

user www-data;
worker_processes 2;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_max_body_size 100m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8008;
        listen [::]:8008;
        absolute_redirect off;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Long enough for Synapse's /sync long-poll and for WebSockets.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        location = / { return 302 /_mm/dashboard/; }
        location = /health { default_type text/plain; return 200 "ok\n"; }

        # SPAs baked into the image (built from web/, as in infra/docker/Dockerfile.web).
        location = /_mm/dashboard { return 301 /_mm/dashboard/; }
        location ^~ /_mm/dashboard/ {
            alias /usr/share/matrixmedia/web/dashboard/;
            try_files $uri $uri/ /_mm/dashboard/index.html;
            add_header Cache-Control "no-cache" always;
        }
        location = /_mm/viewer { return 301 /_mm/viewer/; }
        location ^~ /_mm/viewer/ {
            alias /usr/share/matrixmedia/web/viewer/;
            try_files $uri $uri/ /_mm/viewer/index.html;
            add_header Cache-Control "no-cache" always;
        }

        # Finished recordings, written by mm-switch.
        location ^~ /_mm/recordings/ {
            alias /data/recordings/;
            autoindex off;
            add_header Access-Control-Allow-Origin * always;
        }

        # mm-core: client/widget API, admin API (the dashboard calls it), public API.
        location ^~ /_mm/client/ { proxy_pass http://127.0.0.1:6167; }
        location ^~ /_mm/fleet/ { proxy_pass http://127.0.0.1:6167; }
        location ^~ /mm/v1/ { proxy_pass http://127.0.0.1:6167; }
        location ^~ /.well-known/matrixmedia/ { proxy_pass http://127.0.0.1:6167; }
        location ^~ /_mm/admin/ { proxy_pass http://127.0.0.1:6168; }

        # mm-switch, prefix stripped. /metrics and /health are not public, as in production.
        location = /_mm/switch/metrics { return 404; }
        location = /_mm/switch/health { return 404; }
        location ^~ /_mm/switch/ { proxy_pass http://127.0.0.1:7890/; }

        # LiveKit signalling (WebSocket), prefix stripped. Media uses UDP 7882 / TCP 7881.
        location ^~ /livekit/ { proxy_pass http://127.0.0.1:7880/; }

        # Nothing else under /_mm is public. In particular /_mm/internal/* (the LiveKit and
        # alert webhooks) must stay reachable from inside the container only: every request
        # through this proxy arrives at mm-core from 127.0.0.1.
        location ^~ /_mm/ { return 404; }

        # Synapse's admin API is not public, as in the production stack (Synapse's
        # reverse-proxy guidance). Nothing in the image needs it on this port: mm-core and
        # the init call Synapse directly on 127.0.0.1:8009. nginx matches the decoded,
        # normalised path, so encoded or dotted variants land here too.
        location ^~ /_synapse/admin { return 404; }

        # Synapse: /_matrix, /_synapse/client, /.well-known/matrix.
        location / { proxy_pass http://127.0.0.1:8009; }
    }
}
