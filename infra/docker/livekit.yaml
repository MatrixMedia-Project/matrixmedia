# LiveKit Server Configuration -- MatrixMedia Development
#
# This file is bind-mounted into the LiveKit container by docker-compose.yml.
# For production, replace the keys and adjust port ranges.

port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 52500
  port_range_end: 52510
  use_external_ip: false
  node_ip: 10.0.0.105
  # Force TCP transport for Docker dev (UDP through Docker Desktop macOS is unreliable)
  force_tcp: true

turn:
  enabled: false
  # Using external coturn instead; LiveKit's built-in TURN disabled
  # domain: mm.local
  # tls_port: 5349
  # udp_port: 3478

keys:
  devkey: devsecret

webhook:
  api_key: devkey
  urls:
    - "http://host.docker.internal:6167/_mm/internal/v1/sfu/webhook"

room:
  auto_create: true
  empty_timeout: 300

logging:
  level: info
