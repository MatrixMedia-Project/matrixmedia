[package]
name = "mm-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mm-server"
path = "src/main.rs"

[features]
default = []
s3 = ["mm-core/s3"]

[dependencies]
mm-core = { workspace = true }
mm-api = { workspace = true }
mm-matrix = { workspace = true }
mm-sfu = { workspace = true }
mm-db = { workspace = true }
mm-payment = { workspace = true }
mm-ads = { workspace = true }

tokio = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio-util = { workspace = true }
sqlx = { workspace = true }
async-stripe = { workspace = true }
moka = { workspace = true }
serde_yaml = "0.9"

[dev-dependencies]
# `test-util` unlocks tokio's paused clock (start_paused / time::advance), which
# lets the supervisor tests exercise the restart backoff (1s -> 2s -> 4s) without
# actually sleeping.
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
