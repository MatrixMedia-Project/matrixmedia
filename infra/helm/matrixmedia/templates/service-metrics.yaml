apiVersion: v1
kind: Service
metadata:
  name: {{ include "matrixmedia.fullname" . }}-metrics
  labels:
    {{- include "matrixmedia.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
  {{- if .Values.podAnnotations }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.config.server.metricsPort | quote }}
    prometheus.io/path: "/metrics"
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "matrixmedia.selectorLabels" . | nindent 4 }}
