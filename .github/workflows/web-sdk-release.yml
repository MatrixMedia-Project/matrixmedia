# MatrixMedia Web SDK — npm release (Changesets)
#
# GATING: This workflow is staged on the `NPM_TOKEN` repo secret and on the
# `@matrixmedia` npm organization being provisioned by the project owner. Until
# both exist, the workflow is harmless: on a push to `main` with no pending
# changesets it no-ops; with pending changesets it opens (or updates) a
# "Version Packages" PR. The actual `changeset publish` step only runs once a
# version PR is merged AND a valid `NPM_TOKEN` is present — without the token,
# publish fails to authenticate and nothing is pushed to the registry.
#
# It publishes ONLY the non-private `@matrixmedia/*` SDK packages
# (`@matrixmedia/client`, `@matrixmedia/widget`, `@matrixmedia/react`).
# Changesets respects each package's `private: true` flag and the `ignore`
# list in `web/.changeset/config.json`, so the private workspace packages
# (`@matrixmedia/viewer`, `@matrixmedia/dashboard`,
# `@matrixmedia/example-react-app`) are never versioned or published.
#
# GITHUB APP: the version branch, PR, tags and releases are written with a
# GitHub App installation token, not GITHUB_TOKEN. The org does not let Actions
# create PRs, and nothing GITHUB_TOKEN creates or pushes starts a workflow, so the
# version PR's required checks on `main` would never run. Needs the repo variable
# `RELEASE_APP_CLIENT_ID` and secret `RELEASE_APP_PRIVATE_KEY` for an app
# installed on this repo with Contents + Pull requests: read & write; until both
# exist, the "Mint release app token" step fails.

name: Web SDK Release

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/web-sdk-release.yml"
  workflow_dispatch: {}

permissions:
  contents: read # every write goes through the app token below
  id-token: write # enables npm publish --provenance

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A persisted GITHUB_TOKEN header would override the app token changesets
          # puts in ~/.netrc, and pushes made with it start no workflows.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build SDK packages
        working-directory: web
        run: npm run build

      - name: Run tests
        working-directory: web
        run: npm run test

      # Minted after npm ci/build/test so dependency scripts never see it.
      - name: Mint release app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          # The changesets monorepo lives under web/, so the action must run
          # there to find web/.changeset (otherwise: "no .changeset directory").
          cwd: web
          version: npm run version-packages
          publish: npm run release
        env:
          # changesets/action v1 reads its token from this env var, not an input.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
