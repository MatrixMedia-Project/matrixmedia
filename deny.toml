# cargo-deny configuration

[licenses]
version = 2
# Allowed licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path dependencies use wildcards by design (workspace = true)
allow-wildcard-paths = true

[advisories]
version = 2
ignore = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
