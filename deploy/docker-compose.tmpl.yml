# MatrixMedia full-stack compose — TEMPLATE
# Rendered by deploy/lib/render.sh; never run directly.
# All ${VAR} references are resolved from:
#   $MM_ROOT/.env          (non-secret config)
#   $MM_ROOT/.env.secrets  (generated by deploy/lib/secrets.sh)
#   $MM_ROOT/config/       (rendered per-service config files)
#
# Network: self-contained mm_network (no external shared_network).
# Traefik: own instance on mm_network with DNS aliases for lk-jwt fix.
#
# Out-of-scope services (sygnal, prometheus, alertmanager, grafana) are
# intentionally omitted — they have no config templates and are not part of
# the installer scope.

# No `version:` key on purpose: the compose-spec `version` field is obsolete —
# newer compose releases (Docker 29 ships compose v5) warn and ignore it. The
# template targets the compose spec, which needs no version declaration.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 50m
    max-file: '3'

services:

  # ── Traefik (own instance) ────────────────────────────────────────────────
  traefik:
    image: ${TRAEFIK_IMAGE:-traefik:v3.5}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    command:
      - --providers.docker=true
      - --providers.docker.network=mm_network
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # Traefik v3's default readTimeout is 60 s and covers the WHOLE request, body included, so a
      # 100 MB ad upload over a 10 Mb/s uplink (about 80 s) would be cut mid-stream. The ad upload
      # intake bounds slow or stalled uploads itself (an upload gate, a 60 s idle timeout per read,
      # and an overall deadline of max(10 min, max_bytes / 64 KiB/s), about 27 min for the default
      # 100 MB cap, advertising.max_file_size_mb), so Traefik must not cut first. 1800 s covers
      # the slowest accepted upload up to about 110 MB; raise it together with that setting.
      - --entrypoints.websecure.transport.respondingtimeouts.readtimeout=1800s
      - --certificatesresolvers.production.acme.httpchallenge=true
      - --certificatesresolvers.production.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.production.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.production.acme.storage=/acme/acme.json
      - --log.level=INFO
      - --accesslog=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${MM_ROOT:-/opt/mm}/config/traefik-dynamic.yaml:/etc/traefik/dynamic.yaml:ro
      - acme-data:/acme
    networks:
      mm_network:
        aliases:
          - "${MM_DOMAIN}"
          - "matrix.${MM_DOMAIN}"
          - "call.${MM_DOMAIN}"

  # ── mm-core ───────────────────────────────────────────────────────────────
  mm-core:
    image: ${MM_REGISTRY}/matrixmedia-mm-core:${MM_VERSION}
    restart: unless-stopped
    logging: *default-logging
    command:
      - serve
      - --admin-bind
      - 0.0.0.0:6168
    environment:
      MM_JWT_SIGNING_KEY: ${MM_JWT_SIGNING_KEY}
      MM_ADMIN_TOKEN: ${MM_ADMIN_TOKEN}
      MM_MATRIX_AS_TOKEN: ${MM_AS_TOKEN}
      MM_MATRIX_HS_TOKEN: ${MM_HS_TOKEN}
      MM_MATRIX_HOMESERVER_URL: http://synapse:8008
      MM_MATRIX_SERVER_NAME: ${MM_DOMAIN}
      MM_MATRIX_BOT_LOCALPART: mmbot
      MM_SFU_LIVEKIT_URL: http://livekit:7880
      MM_SFU_LIVEKIT_API_KEY: ${LK_API_KEY}
      MM_SFU_LIVEKIT_API_SECRET: ${LK_API_SECRET}
      MM_CORS_ORIGINS: https://matrix.${MM_DOMAIN}
      MM_DATABASE_URL: postgres://mm_admin:${POSTGRES_APP_ADMIN_PASS}@mm-postgres:5432/matrixmedia
      MM_POSTGRES_URL: postgres://mm_admin:${POSTGRES_APP_ADMIN_PASS}@mm-postgres:5432/matrixmedia
      MM_MONETIZATION_ENABLED: ${MM_MONETIZATION_ENABLED:-true}
      MM_MONETIZATION_DONATIONS_ENABLED: ${MM_MONETIZATION_DONATIONS_ENABLED:-true}
      MM_MONETIZATION_SUBSCRIPTIONS_ENABLED: ${MM_MONETIZATION_SUBSCRIPTIONS_ENABLED:-true}
      MM_STRIPE_SECRET_KEY: ${MM_STRIPE_SECRET_KEY}
      MM_STRIPE_WEBHOOK_SECRET: ${MM_STRIPE_WEBHOOK_SECRET}
      MM_ALLOW_MOCK: ${MM_ALLOW_MOCK}
      MM_STRIPE_API_BASE: ${MM_STRIPE_API_BASE}
      MM_SYNAPSE_ADMIN_TOKEN: ${MM_SYNAPSE_ADMIN_TOKEN}
      MM_SERVER_PUBLIC_URL: https://matrix.${MM_DOMAIN}
      MM_SFU_LIVEKIT_PUBLIC_URL: wss://matrix.${MM_DOMAIN}/livekit
      MM_FEDERATION_ENABLED: ${MM_FEDERATION_ENABLED:-true}
      MM_FEED_ENABLED: 'true'
      MM_ADVERTISING_ENABLED: ${MM_ADVERTISING_ENABLED:-true}
      MM_LNBITS_ENABLED: ${MM_LNBITS_ENABLED:-false}
      MM_LNBITS_URL: http://lnbits:5000
      # Empty = not configured. mm-core stores a non-empty key at its first start as a
      # dashboard secret, so never give these a stand-in value.
      MM_LNBITS_INVOICE_KEY: ${MM_LNBITS_INVOICE_KEY:-}
      MM_LNBITS_ADMIN_KEY: ${MM_LNBITS_ADMIN_KEY:-}
      MM_SWITCH_URL: http://mm-switch:7890
      MM_SWITCH_LEGACY_LK_SOURCE: 'false'
      MM_SWITCH_AUTH_SECRET: ${MM_SWITCH_AUTH_SECRET}
      # Ephemeral TURN credentials — OFF by default (empty → GET /turn-credentials
      # 404s → clients keep the static fallback pair, so existing flows are
      # unchanged). To ENABLE: set MM_TURN_SHARED_SECRET in .env to the SAME
      # value as coturn's --static-auth-secret AND enable coturn's use-auth-secret
      # (see the coturn service). These two MUST flip together: once mm-core
      # returns creds the client uses them (not the fallback), so a coturn still
      # in lt-cred-mech-only mode would reject them.
      # BEFORE ENABLING, verify (a) coturn accepts BOTH use-auth-secret and the
      # static --user at once, and (b) mm-switch (which relays via the static
      # MM_SWITCH_TURN_USER/PASS below) still authenticates — else the SFU relay
      # breaks. See WorkingDirectory/docs/turn-ephemeral-creds-2026-07-15.md.
      MM_TURN_SHARED_SECRET: ${MM_TURN_SHARED_SECRET:-}
      MM_TURN_URLS: turn:${MM_DOMAIN}:3478
      MM_TURN_TTL_SECS: ${MM_TURN_TTL_SECS:-86400}
      MM_SYNAPSE_REGISTRATION_SHARED_SECRET_FROM_FILE: /run/secrets/synapse_registration_shared_secret
      MM_SIGNUP_IP_HASH_PEPPER_FROM_FILE: /run/secrets/signup_ip_hash_pepper
      MM_SIGNUP_RATE_LIMIT_PER_IP_PER_HOUR: '5'
      MM_SIGNUP_TOS_CURRENT_VERSION: v1
      MM_MATRIX_PUBLIC_HOMESERVER_URL: https://matrix.${MM_DOMAIN}
      MM_DEMO_MODE: ${MM_DEMO_MODE}
      MM_SERVER_REQUEST_WEBHOOK_URL: ${MM_SERVER_REQUEST_WEBHOOK_URL:-}
      # Bearer token Alertmanager must send to /_mm/internal/alert-webhook (its
      # receiver's http_config.authorization). Empty = only requests that reach mm-core
      # straight from the docker network are accepted. See deploy/README.md → Observability.
      MM_ALERT_WEBHOOK_TOKEN: ${MM_ALERT_WEBHOOK_TOKEN:-}
      # Dashboard settings (Operator Console → System → Settings). The key encrypts
      # secret settings at rest; MM_SETTINGS_SAFE_MODE=1 ignores dashboard values and
      # runs from this file (break-glass). See deploy/docs/settings.md.
      MM_SETTINGS_ENCRYPTION_KEY: ${MM_SETTINGS_ENCRYPTION_KEY:-}
      MM_SETTINGS_ENCRYPTION_KEY_PREVIOUS: ${MM_SETTINGS_ENCRYPTION_KEY_PREVIOUS:-}
      MM_SETTINGS_SAFE_MODE: ${MM_SETTINGS_SAFE_MODE:-}
      # Fleet kill-switch and orphan-sweep grace, read from .env at boot (change them there,
      # then `mmctl start`). mm-fleet-runner gets the same two lines below, so one .env value
      # drives both processes. Non-empty defaults on purpose: mm-core reads an empty
      # MM_FLEET_MODE as an error, not as unset.
      MM_FLEET_MODE: ${MM_FLEET_MODE:-frozen}
      MM_FLEET_ORPHAN_MIN_AGE_SECS: ${MM_FLEET_ORPHAN_MIN_AGE_SECS:-1800}
      # Where ad uploads land (internal spec 2026-10-11 §5.10): only incoming/ is mounted below,
      # so mm-core can write nothing the public web root serves. mm-media-worker converts these
      # files and publishes the result into web/ads/r/ itself.
      MM_ADS_MEDIA_DIR: /mm-ad-media
    volumes:
      - mm-data:/data
      - ${MM_ROOT:-/opt/mm}/ad-media/incoming:/mm-ad-media/incoming
    depends_on:
      synapse:
        condition: service_healthy
      livekit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - -H
        - "Authorization: Bearer ${MM_ADMIN_TOKEN}"
        - http://localhost:6168/_mm/admin/v1/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mm_network
      - internal
      - mm-db-net
    labels:
      - traefik.enable=true
      - "traefik.http.routers.mm-client.rule=Host(`matrix.${MM_DOMAIN}`) && PathPrefix(`/_mm/client`)"
      - traefik.http.routers.mm-client.entrypoints=websecure
      - traefik.http.routers.mm-client.tls.certresolver=production
      - traefik.http.services.mm-client.loadbalancer.server.port=6167
      - "traefik.http.routers.mm-admin.rule=Host(`matrix.${MM_DOMAIN}`) && PathPrefix(`/_mm/admin`)"
      - traefik.http.routers.mm-admin.entrypoints=websecure
      - traefik.http.routers.mm-admin.tls.certresolver=production
      - traefik.http.services.mm-admin.loadbalancer.server.port=6168
      - "traefik.http.routers.mm-public.rule=Host(`matrix.${MM_DOMAIN}`) && PathPrefix(`/mm/v1`)"
      - traefik.http.routers.mm-public.entrypoints=websecure
      - traefik.http.routers.mm-public.tls.certresolver=production
      - traefik.http.services.mm-public.loadbalancer.server.port=6167
    secrets:
      - source: synapse_registration_shared_secret
        target: synapse_registration_shared_secret
      - source: signup_ip_hash_pepper
        target: signup_ip_hash_pepper

  # ── mm-fleet-runner ───────────────────────────────────────────────────────
  # The only process that holds cloud credentials. Never exposed; talks to Postgres only.
  # Same image as mm-core, own entrypoint. It never runs migrations and refuses to start
  # before V042 exists, so it restarts until mm-core has migrated. It takes a Postgres
  # leader lock first, so a second copy simply waits.
  #
  # OPT-IN (compose profile "fleet", switched on by MM_FLEET_RUNNER=true in .env): the
  # installer does not create its Postgres role, set that role's password or create its
  # key directory, so as a default service it would crash-loop on every fresh install.
  # `mmctl start` (and stop/update/upgrade/rotate) pick the profile up from .env. To enable
  # it, in order, as root on the host (full copy: deploy/docs/rotation-runbooks.md, runbook C):
  #
  #   : "${MM_ROOT:=/opt/mm}"      # the same compose call mmctl builds (its DC array)
  #   DC=(docker compose --env-file "$MM_ROOT/versions.env" --env-file "$MM_ROOT/.env"
  #       --env-file "$MM_ROOT/.env.secrets" -f "$MM_ROOT/docker-compose.yml" -p matrixmedia)
  #
  #   1. After mm-core has started once (it runs the migrations), from the checkout you
  #      installed from: create the role, then set its password from .env.secrets. The
  #      password goes in on stdin (printf is a shell builtin), never on a command line:
  #        "${DC[@]}" exec -T mm-postgres psql -q -v ON_ERROR_STOP=1 -U postgres \
  #          -d matrixmedia -f - < deploy/sql/mm_fleet_runner_role.sql
  #        pw="$(grep '^POSTGRES_FLEET_RUNNER_PASS=' "$MM_ROOT/.env.secrets" | head -1 | cut -d= -f2-)"
  #        printf "ALTER ROLE mm_fleet_runner PASSWORD '%s';\n" "$pw" \
  #          | "${DC[@]}" exec -T mm-postgres psql -q -v ON_ERROR_STOP=1 -U postgres -d postgres -f -
  #        unset pw
  #   2. Create the key directory, mode 0700, owned by the image's `matrixmedia` uid, on a
  #      filesystem with hard links (see the volume note below):
  #        uid="$("${DC[@]}" run --rm -T --no-deps --entrypoint id mm-core -u matrixmedia)"
  #        gid="$("${DC[@]}" run --rm -T --no-deps --entrypoint id mm-core -g matrixmedia)"
  #        install -d -m 0700 -o "$uid" -g "$gid" "$MM_ROOT/secrets/fleet-runner"
  #   3. Switch it on:   echo 'MM_FLEET_RUNNER=true' >> "$MM_ROOT/.env"
  #                      (edit the line instead if .env already has one)
  #   4. mmctl start
  mm-fleet-runner:
    image: ${MM_REGISTRY}/matrixmedia-mm-core:${MM_VERSION}
    entrypoint: [mm-fleet-runner]
    command: [run]
    restart: unless-stopped
    profiles: ["fleet"]
    depends_on:
      - mm-postgres
      - mm-core
    environment:
      MM_FLEET_RUNNER_DATABASE_URL: postgres://mm_fleet_runner:${POSTGRES_FLEET_RUNNER_PASS}@mm-postgres:5432/matrixmedia
      MM_FLEET_RUNNER_KEY_FILE: /run/mm-fleet-runner/key.json
      MM_FLEET_TFVARS_PATH: /var/lib/mm-fleet/desired_nodes.auto.tfvars.json
      # The same two .env values mm-core gets (see its environment), so the runner and
      # mm-core agree on the kill-switch and the orphan grace when no settings row exists.
      MM_FLEET_MODE: ${MM_FLEET_MODE:-frozen}
      MM_FLEET_ORPHAN_MIN_AGE_SECS: ${MM_FLEET_ORPHAN_MIN_AGE_SECS:-1800}
      # /metrics for Prometheus, on the docker networks only (no `ports:`): the runner is
      # never reachable from outside.
      MM_FLEET_RUNNER_LISTEN: 0.0.0.0:9465
      RUST_LOG: info
    healthcheck:
      # Healthy while the process serves /metrics, a standby waiting for the leader lock
      # included. A stale heartbeat is alerted on separately (MMFleetRunnerStaleWithRentedNodes).
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9465/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      # A directory, not a compose secret: the runner creates the 0600 key file itself on
      # first boot, and compose `secrets:` cannot carry uid/gid/mode outside Swarm.
      # The host directory must exist before the first start, be owned by the image's
      # `matrixmedia` uid and be mode 0700 (enable step 2 above), and must live on a
      # filesystem with hard links (no FAT/NFS): the runner creates the key via a temp file
      # plus a hard link. If it is missing, Docker creates it root-owned and the runner
      # cannot write its key. The key (secrets/fleet-runner/key.json) is NOT in rotation
      # backups or `mmctl backup`: back it up separately and offline
      # (deploy/docs/secrets-inventory.md).
      - ${MM_ROOT:-/opt/mm}/secrets/fleet-runner:/run/mm-fleet-runner
      - mm-fleet-tfvars:/var/lib/mm-fleet
    networks:
      - internal
      - mm-db-net

  # Ad conversion (internal spec 2026-10-11, D1). The only process that parses upload bytes,
  # so it is sandboxed: no port, no internet (mm-ads-net is internal), read-only root, no
  # capabilities, its own least-privilege DB role, and hard CPU/memory caps so an encode never
  # starves live media. Opt in with MM_MEDIA_WORKER=true, after creating its Postgres role,
  # setting that role's password and adding a host firewall rule for the bridge: the steps
  # (and the commands) are in deploy/docs/rotation-runbooks.md, runbook C, "Enabling the ad
  # media worker". The installer does none of them.
  mm-media-worker:
    image: ${MM_REGISTRY}/matrixmedia-mm-media-worker:${MM_VERSION}
    restart: unless-stopped
    profiles: ["ads"]
    logging: *default-logging
    depends_on:
      - mm-postgres
      - mm-core
    # A tiny init as PID 1: when a job's ffmpeg is killed, its descendants reparent to PID 1,
    # and without an init nothing reaps them. They would pile up as zombies against pids_limit.
    init: true
    # The worker's shutdown waits up to 20 s while it releases the jobs it is running, so give
    # it longer than compose's default 10 s before the SIGKILL.
    stop_grace_period: 30s
    environment:
      MM_MEDIA_WORKER_DATABASE_URL: postgres://mm_media_worker:${POSTGRES_MEDIA_WORKER_PASS}@mm-postgres:5432/matrixmedia
      MM_MEDIA_WORKER_MEDIA_ROOT: /mm-ad-media
      MM_MEDIA_WORKER_PUBLIC_ROOT: /mm-ads-public
      MM_MEDIA_WORKER_CONCURRENCY: "1"
      MM_MEDIA_WORKER_THREADS: "2"
      MM_MEDIA_WORKER_ORPHAN_DELETE: ${MM_MEDIA_WORKER_ORPHAN_DELETE:-false}
      # MM_MEDIA_WORKER_ALIVE_FILE is left unset on purpose: its default, /tmp/mm-media-worker.alive,
      # is on the tmpfs /tmp below, so the healthcheck works with read_only: true.
      # MM_MEDIA_WORKER_FETCH_BASE is left unset on purpose: the only value it may take is its
      # default, http://mm-web/_mm/ads (a trailing slash is tolerated). mm-core follows a creative's
      # cdn_url only under that base, so the worker refuses to start with any other value instead of
      # publishing ads that are never served.
      RUST_LOG: info
    read_only: true
    # No writable place but these: the alive file in /tmp (ffmpeg works in /mm-ad-media/work),
    # and empty, tiny tmpfs mounts over /data and /etc/matrixmedia, which the image declares as
    # VOLUMEs and Docker would otherwise back with writable anonymous volumes.
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /data:size=1m,noexec,nosuid,nodev
      - /etc/matrixmedia:size=1m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # A core dump of this process would contain its database URL.
    ulimits:
      core: 0
    # pids_limit counts threads, not just processes. 64 is sized for MM_MEDIA_WORKER_CONCURRENCY=1
    # and MM_MEDIA_WORKER_THREADS=2: with the thread caps in conversion/profile.rs one ffmpeg
    # peaks near 10 threads and the worker's own runtime near 10. Raise concurrency or threads
    # and this has to grow with them.
    pids_limit: 64
    cpus: 1.5
    cpu_shares: 128
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "mm-media-worker", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - ${MM_ROOT:-/opt/mm}/ad-media:/mm-ad-media
      - ${MM_ROOT:-/opt/mm}/web/ads:/mm-ads-public
    networks:
      - mm-ads-net

  # ── mm-fakestripe (active only when MM_DEMO_MODE=true) ───────────────────
  mm-fakestripe:
    image: ${MM_FAKESTRIPE_IMAGE:-ghcr.io/matrixmedia-project/matrixmedia-mm-fakestripe:0.2.1}
    restart: unless-stopped
    profiles: ["demo"]
    logging: *default-logging
    environment:
      MM_FAKESTRIPE_LISTEN: 0.0.0.0:8787
      MM_FAKESTRIPE_WEBHOOK_URL: http://mm-core:6167/_mm/webhooks/stripe
      MM_FAKESTRIPE_WEBHOOK_SECRET: ${MM_STRIPE_WEBHOOK_SECRET}
      MM_FAKESTRIPE_WEBHOOK_DELAY_MS: '500'
      RUST_LOG: mm_fakestripe=info
    networks:
      - mm_network
      - internal

  # ── Synapse ───────────────────────────────────────────────────────────────
  synapse:
    image: ${SYNAPSE_IMAGE:-matrixdotorg/synapse:v1.145.0}
    restart: unless-stopped
    logging: *default-logging
    # Ensure /data is writable by synapse uid 991 on a fresh (empty) volume.
    # start.py does NOT chown in run-mode; we must do it before delegating.
    # Only chown the directory itself (not recursive) to avoid touching ro bind-mounts.
    entrypoint: ["/bin/sh", "-c", "chown 991:991 /data && exec /start.py"]
    environment:
      SYNAPSE_SERVER_NAME: ${MM_DOMAIN}
      SYNAPSE_REPORT_STATS: 'no'
    volumes:
      - synapse-data:/data
      - ${MM_ROOT:-/opt/mm}/config/homeserver.yaml:/data/homeserver.yaml:ro
      # Static filename for log config (render.sh produces synapse-log.config → mounted as /data/log.config)
      - ${MM_ROOT:-/opt/mm}/config/synapse-log.config:/data/log.config:ro
      - ${MM_ROOT:-/opt/mm}/config/mm_appservice.yaml:/synapse_conf/mm_appservice.yaml:ro
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8008/_matrix/client/versions
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mm_network
      - internal
    labels:
      - traefik.enable=true
      - "traefik.http.routers.matrix-synapse.rule=Host(`matrix.${MM_DOMAIN}`) && !PathPrefix(`/_mm`) && !PathPrefix(`/mm/v1`) && !PathPrefix(`/livekit`) && !PathPrefix(`/lk-jwt`)"
      - traefik.http.routers.matrix-synapse.entrypoints=websecure
      - traefik.http.routers.matrix-synapse.tls.certresolver=production
      - traefik.http.services.matrix-synapse.loadbalancer.server.port=8008

  # ── PostgreSQL (Synapse) ──────────────────────────────────────────────────
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_SYNAPSE_PASS}
      POSTGRES_INITDB_ARGS: --encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U synapse
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── LiveKit ───────────────────────────────────────────────────────────────
  livekit:
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:v1.9.1}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "7881:7881"
      - "50000-50020:50000-50020/udp"
    volumes:
      - ${MM_ROOT:-/opt/mm}/config/livekit.yaml:/etc/livekit.yaml:ro
      - recordings-data:/data/recordings
    command: --config /etc/livekit.yaml --bind 0.0.0.0
    depends_on:
      lk-redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://localhost:7880
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mm_network
      - internal
    labels:
      - traefik.enable=true
      - "traefik.http.routers.livekit.rule=Host(`matrix.${MM_DOMAIN}`) && PathPrefix(`/livekit`)"
      - traefik.http.routers.livekit.entrypoints=websecure
      - traefik.http.routers.livekit.tls.certresolver=production
      - traefik.http.routers.livekit.middlewares=livekit-strip
      - traefik.http.middlewares.livekit-strip.stripprefix.prefixes=/livekit
      - traefik.http.services.livekit.loadbalancer.server.port=7880

  # ── LiveKit Redis ─────────────────────────────────────────────────────────
  lk-redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - ${REDIS_PASSWORD}
        - ping
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  # ── LiveKit Egress ────────────────────────────────────────────────────────
  livekit-egress:
    image: ${LIVEKIT_EGRESS_IMAGE:-livekit/egress:v1.13.0}
    restart: unless-stopped
    logging: *default-logging
    environment:
      EGRESS_CONFIG_FILE: /etc/egress/config.yaml
    cap_add:
      - SYS_ADMIN
    volumes:
      - recordings-data:/data/recordings
      - ${MM_ROOT:-/opt/mm}/config/livekit-egress.yaml:/etc/egress/config.yaml:ro
    depends_on:
      livekit:
        condition: service_healthy
      lk-redis:
        condition: service_healthy
    networks:
      - internal

  # ── LiveKit Ingress ───────────────────────────────────────────────────────
  livekit-ingress:
    image: ${LIVEKIT_INGRESS_IMAGE:-livekit/ingress:v1.5.0}
    restart: unless-stopped
    logging: *default-logging
    environment:
      INGRESS_CONFIG_FILE: /etc/ingress/config.yaml
    volumes:
      - ${MM_ROOT:-/opt/mm}/config/livekit-ingress.yaml:/etc/ingress/config.yaml:ro
    depends_on:
      livekit:
        condition: service_healthy
      lk-redis:
        condition: service_healthy
    networks:
      - internal

  # ── mm-switch ─────────────────────────────────────────────────────────────
  mm-switch:
    image: ${MM_REGISTRY}/matrixmedia-mm-switch:${MM_SWITCH_VERSION}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "50100-50300:50100-50300/udp"
    environment:
      MM_SWITCH_LISTEN: 0.0.0.0:7890
      MM_SWITCH_PUBLIC_IP: ${MM_PUBLIC_IP}
      MM_SWITCH_UDP_START: '50100'
      MM_SWITCH_UDP_END: '50300'
      MM_SWITCH_TURN: "turn:${MM_DOMAIN}:3478"
      MM_SWITCH_TURN_USER: ${TURN_USER}
      MM_SWITCH_TURN_PASS: ${TURN_PASS}
      MM_SWITCH_AUTH_SECRET: ${MM_SWITCH_AUTH_SECRET}
      # This is the fleet's ORIGIN. Fleet nodes (fanout/edge/transcode) are
      # provisioned with MM_SWITCH_NODE_FLAVOR set to their own flavor and REFUSE
      # to start without MM_SWITCH_AUTH_SECRET (FR-348); the origin may still run
      # unsecured for single-host OSS installs, which is why it is named here.
      MM_SWITCH_NODE_FLAVOR: origin
      # FR-349b, owner decision 2026-09-24: GET /api/viewers returns every viewer
      # id on the node, and viewer ids are derived from Matrix user ids
      # (viewer-{stream}-{@user-hs}) — so an open endpoint tells anyone who can
      # reach it which Matrix users are watching which stream. The Traefik router
      # below publishes /_mm/switch/**, so this WAS reachable from the internet.
      # Cost of closing it: the Flutter demo client's live viewer count stops
      # updating (it polls unauthenticated and ignores non-200), nothing else.
      MM_SWITCH_PRIVATE_VIEWER_LIST: ${MM_SWITCH_PRIVATE_VIEWER_LIST:-true}
    volumes:
      - recordings-data:/data/recordings
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://localhost:7890/health
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - mm_network
      - internal
    labels:
      - traefik.enable=true
      # /metrics + /health excluded (unauthenticated) — keep in lockstep with the
      # mm-switch router rule in deploy/templates/traefik-dynamic.tmpl.yaml.
      # /api/viewers was public for the viewer-count UI. DECIDED 2026-09-24
      # (FR-349b): it is now authenticated at the application layer via
      # MM_SWITCH_PRIVATE_VIEWER_LIST above, because viewer ids embed Matrix user
      # ids. Left on this router deliberately — mm-core calls it WITH a server
      # token, so removing the route would break the operator console, whereas the
      # app-layer gate rejects everyone else with a 401.
      - "traefik.http.routers.mm-switch.rule=Host(`matrix.${MM_DOMAIN}`) && PathPrefix(`/_mm/switch`) && !Path(`/_mm/switch/metrics`) && !Path(`/_mm/switch/health`)"
      - traefik.http.routers.mm-switch.entrypoints=websecure
      - traefik.http.routers.mm-switch.tls.certresolver=production
      - traefik.http.routers.mm-switch.middlewares=mm-switch-strip
      - traefik.http.middlewares.mm-switch-strip.stripprefix.prefixes=/_mm/switch
      - traefik.http.services.mm-switch.loadbalancer.server.port=7890

  # ── LNbits ────────────────────────────────────────────────────────────────
  lnbits:
    image: ${LNBITS_IMAGE:-lnbitsdocker/lnbits:ec874ba}
    restart: unless-stopped
    profiles: ["demo"]
    logging: *default-logging
    environment:
      LNBITS_ADMIN_UI: 'true'
      LNBITS_BACKEND_WALLET_CLASS: FakeWallet
      LNBITS_DATA_FOLDER: /data
      LNBITS_DEFAULT_WALLET_NAME: MatrixMedia
      SUPER_USER: admin
      # No LNBITS_ADMIN_USERS on purpose: on a fresh lnbits-data volume no `admin`
      # account exists yet, so naming one locks the operator out of the Admin UI.
      # The first account created through the web UI becomes the superuser — see
      # deploy/docs/lnbits.md (fresh-volume bootstrap) and set the keys it yields
      # in Operator Console → System → Settings → Monetization.
      LNBITS_SITE_TITLE: MatrixMedia Lightning
      LNBITS_SITE_TAGLINE: Instant micropayments for streaming
    volumes:
      - lnbits-data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - -o
        - /dev/null
        - http://localhost:5000/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - mm_network
      - internal
    labels:
      - traefik.enable=true
      - "traefik.http.routers.lnbits.rule=Host(`matrix.${MM_DOMAIN}`) && PathPrefix(`/_mm/lnbits`)"
      - traefik.http.routers.lnbits.entrypoints=websecure
      - traefik.http.routers.lnbits.tls.certresolver=production
      - traefik.http.routers.lnbits.middlewares=lnbits-strip
      - traefik.http.middlewares.lnbits-strip.stripprefix.prefixes=/_mm/lnbits
      - traefik.http.services.lnbits.loadbalancer.server.port=5000

  # ── coturn (TURN/STUN) ────────────────────────────────────────────────────
  coturn:
    image: ${COTURN_IMAGE:-coturn/coturn:4.7.0}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "50021-50040:50021-50040/udp"
    # Static long-term credentials only (unchanged default). To move to
    # ephemeral REST creds (mm-core /turn-credentials), add BEFORE --user:
    #     --use-auth-secret --static-auth-secret=<SAME as MM_TURN_SHARED_SECRET>
    # and set MM_TURN_SHARED_SECRET on mm-core to the same value.
    # NOT enabled by default: it is UNVERIFIED that coturn 4.7.0 honors both
    # use-auth-secret AND the static --user in one realm — if it does not, the
    # static --user (used by mm-switch's own relay, MM_SWITCH_TURN_* above) stops
    # authenticating and the SFU relay path breaks. Verify with
    # `turnutils_uclient -u ${TURN_USER} -w <pass>` against a coturn started with
    # both flags before enabling. Then, after all clients ship the ephemeral
    # path, drop --user/--lt-cred-mech and rotate TURN_PASS.
    command: >-
      -n --log-file=stdout
      --realm=${MM_DOMAIN}
      --external-ip=${MM_PUBLIC_IP}
      --min-port=50021 --max-port=50040
      --user=${TURN_USER}:${TURN_PASS}
      --lt-cred-mech --fingerprint --no-cli
    networks:
      - internal

  # (MinIO was removed 2026-09-26. Nothing in this stack used it — mm-core stores
  #  media on the local `mm-data` volume and LiveKit Egress writes recordings to local
  #  files — and its images stopped being publicly pullable, which broke
  #  `docker compose up` for a service nobody talked to.
  #
  #  It was there for S3 features that exist in the code but were never switched on.
  #  Configuring an S3-compatible store (external: R2, B2, AWS; or a bundled SeaweedFS)
  #  via MM_STORAGE_S3_* enables two separate things:
  #
  #   - Media storage in S3 — only with MM_STORAGE_BACKEND=s3.
  #   - HLS for live video — whenever MM_STORAGE_S3_BUCKET is set, WHATEVER the
  #     backend: every video/screen stream then also starts a LiveKit HLS egress
  #     writing segments to `streams/{id}/` in the bucket (mm-api client.rs,
  #     build_egress_s3_config). Setting S3 credentials "just for media" turns this on.
  #     Without a bucket it is silently skipped — which is why it has never run here.
  #
  #  If you enable it: the livekit-egress container uploads the segments itself, so the
  #  endpoint must be reachable from THAT container, not only from mm-core; and the URLs
  #  mm-core hands out are unsigned, so the bucket needs public read or a CDN in front.)

  # ── mm-web (nginx static + recordings) ───────────────────────────────────
  mm-web:
    # SPAs are BAKED INTO THE IMAGE. Previously this was a bare nginx:alpine with
    # ${MM_ROOT}/web bind-mounted over the docroot — but nothing in the install
    # path ever populated that directory, so a fresh install served a 404 UI
    # while the smoke test still passed. Do NOT reintroduce a mount over
    # /usr/share/nginx/html: it would mask the baked dashboard/ and viewer/.
    # nginx.conf stays a mount because it is rendered from a template (${MM_DOMAIN}).
    image: ${MM_WEB_IMAGE:-ghcr.io/matrixmedia-project/matrixmedia-mm-web:${MM_VERSION:-latest}}
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ${MM_ROOT:-/opt/mm}/config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - recordings-data:/recordings:ro
      # Converted ad renditions (web/ads/r/) and legacy ad files, read-only. This one subdirectory
      # mount does not mask the baked dashboard/viewer (see the note above): the image has no
      # html/ads of its own. mm-media-worker is the only writer.
      - ${MM_ROOT:-/opt/mm}/web/ads:/usr/share/nginx/html/ads:ro
    healthcheck:
      # Explicit IPv4 + port (option A): bare `localhost` may resolve to ::1
      # first while nginx `listen 80` binds IPv4, flapping the service
      # unhealthy on an otherwise fine host.
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:80/health
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - mm_network
      - internal

  # ── mm-postgres (app DB) ──────────────────────────────────────────────────
  mm-postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: matrixmedia-mm-postgres-1
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256 --encoding=UTF-8 --lc-collate=C --lc-ctype=C
      POSTGRES_PASSWORD_FILE: /run/secrets/mm_db_admin_password
    volumes:
      - mm-postgres-data:/var/lib/postgresql/data
      # Flattened subdir paths: mm-postgres/{postgresql,pg_hba}.conf → mm-postgres-*.conf
      - ${MM_ROOT:-/opt/mm}/config/mm-postgres-postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ${MM_ROOT:-/opt/mm}/config/mm-postgres-pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      # Flattened: mm-postgres/init/ → single file mm-postgres-init.sql
      - ${MM_ROOT:-/opt/mm}/config/mm-postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    secrets:
      - mm_db_app_password
      - mm_db_admin_password
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -h 127.0.0.1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    cpus: 1.0
    networks:
      - mm-db-net
      # The sandboxed ad-conversion worker reaches Postgres here and nowhere else.
      - mm-ads-net

  # ── Element Call ──────────────────────────────────────────────────────────
  element-call:
    image: ${ELEMENT_CALL_IMAGE:-ghcr.io/element-hq/element-call:v0.15.0}
    restart: unless-stopped
    logging: *default-logging
    environment:
      DEFAULT_HOMESERVER: https://matrix.${MM_DOMAIN}
      LIVEKIT_SERVICE_URL: wss://matrix.${MM_DOMAIN}/livekit
    volumes:
      # Flattened subdir path: element-call/config.json → element-call-config.json
      - ${MM_ROOT:-/opt/mm}/config/element-call-config.json:/app/config.json:ro
    networks:
      - mm_network
      - internal
    # Routed by the FILE provider (config/traefik-dynamic.yaml, `element-call`
    # router), not by docker labels: the call path then routes identically
    # whatever Docker version the host runs. enable=false guards against the
    # docker provider ever picking this service up alongside the file router.
    labels:
      - traefik.enable=false
    depends_on:
      synapse:
        condition: service_started
      livekit:
        condition: service_healthy

  # ── lk-jwt-service ────────────────────────────────────────────────────────
  # extra_hosts removed: Traefik aliases on mm_network handle internal routing
  lk-jwt-service:
    image: ${LK_JWT_IMAGE:-ghcr.io/element-hq/lk-jwt-service:latest-ci}
    restart: unless-stopped
    logging: *default-logging
    environment:
      LIVEKIT_KEY: ${LK_API_KEY}
      LIVEKIT_SECRET: ${LK_API_SECRET}
      LIVEKIT_URL: wss://matrix.${MM_DOMAIN}/livekit
      LIVEKIT_JWT_SERVICE_HOMESERVERS: matrix.${MM_DOMAIN}
    networks:
      - mm_network
      - internal
    # Routed by the FILE provider (config/traefik-dynamic.yaml, `lk-jwt` router
    # with the same priority-200 strip rule), not by docker labels — same
    # Docker-version independence as element-call above.
    labels:
      - traefik.enable=false

volumes:
  mm-data:
  synapse-data:
  postgres-data:
  mm-postgres-data:
  recordings-data:
  lnbits-data:
  acme-data:
  mm-fleet-tfvars: {}

networks:
  # Project-local bridge replaces the external shared_network.
  # Traefik aliases ensure lk-jwt-service can reach matrix.${MM_DOMAIN} internally.
  mm_network:
    driver: bridge
  internal:
    driver: bridge
  mm-db-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # Postgres and mm-media-worker only. `internal: true` gives it no NAT and no forwarding, so a
  # compromised ffmpeg cannot reach the internet or the host's other networks. It does NOT hide
  # the host itself: the bridge's gateway address (172.29.0.1) is the host, so a service the host
  # listens on at 0.0.0.0 (sshd, an exporter) is reachable from the worker unless the host's
  # firewall drops what arrives on this bridge. Docker Engine 28+ can remove that address
  # (gateway_mode_ipv4: isolated), but 27.x rejects the value and older engines ignore it, so
  # the supported fix is the INPUT rule in rotation-runbooks.md (runbook C, "Enabling the ad
  # media worker"). The bridge has a fixed name, mm-ads0, so that rule can name it.
  mm-ads-net:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.name: mm-ads0
    ipam:
      config:
        - subnet: 172.29.0.0/24

secrets:
  mm_db_app_password:
    file: ${MM_ROOT:-/opt/mm}/secrets/mm_db_app_password
  mm_db_admin_password:
    file: ${MM_ROOT:-/opt/mm}/secrets/mm_db_admin_password
  synapse_registration_shared_secret:
    file: ${MM_ROOT:-/opt/mm}/secrets/synapse_registration_shared_secret
  signup_ip_hash_pepper:
    file: ${MM_ROOT:-/opt/mm}/secrets/signup_ip_hash_pepper
