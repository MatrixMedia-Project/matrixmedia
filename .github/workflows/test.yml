name: test

# Cargo test on the Rust workspace. Intentionally does NOT enforce
# `cargo fmt --all -- --check` or `cargo clippy -D warnings` — both
# are red across the codebase as of 0.6.12 and would need a separate
# cleanup pass before they can be made gates. Keeping `cargo test`
# CI'd in the meantime catches actual logic regressions.
#
# When fmt + clippy get cleaned up, add them as separate jobs here
# (or split into a lint.yml workflow).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cargo-test:
    runs-on: mm-runners
    timeout-minutes: 25
    env:
      # The mm-api / mm-db integration tests run against this database; they
      # self-apply the schema via mm_db::run_pg_migrations(). Without it they
      # skip (return early), which left the runtime sqlx query_as / FromRow
      # layer untested in CI — the exact class of bug behind the /creators 500
      # (a struct field with no matching SELECT column only fails at runtime).
      MM_DATABASE_URL: postgres://postgres:citest@localhost:5432/mm_test
      # Fail-loud guard: with this set, mm_db::test_support panics instead
      # of skipping when the DB is missing/unreachable. CI must never skip.
      MM_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4

      # ARC ephemeral runner pods ship the minimal actions/actions-runner
      # image — no C toolchain, so cargo's build scripts (proc-macro2,
      # libc, openssl-sys, etc.) fail with "linker cc not found".
      # pkg-config + libssl-dev are pulled in for native-tls / openssl-sys.
      # Postgres is installed via apt (not a `services:` container) because the
      # ARC runners have no Docker-in-Docker (platform handoff
      # 2026-05-08-custom-runner-image-and-dind).
      - name: install build toolchain + postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential pkg-config libssl-dev postgresql postgresql-client
          # Start the auto-created cluster (service works on the Ubuntu runner
          # image; pg_ctlcluster is the fallback if init is absent).
          sudo service postgresql start \
            || sudo pg_ctlcluster "$(pg_lsclusters -h | awk 'NR==1{print $1}')" main start
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'citest';"
          sudo -u postgres createdb mm_test
          ok=0
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres && { ok=1; break; }
            sleep 1
          done
          [ "$ok" -eq 1 ] || { echo "::error::Postgres never became ready after 30s"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test --workspace
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee /tmp/cargo-test.log

      # Defense-in-depth behind the MM_REQUIRE_DB guard: catches any future
      # test file that reinvents a silent "— skipping" early-return without
      # going through mm_db::test_support.
      - name: assert nothing skipped
        if: always()
        run: |
          if grep -F -- "— skipping" /tmp/cargo-test.log; then
            echo "::error::DB-gated tests skipped in CI — env wiring or Postgres is broken"
            { echo "## cargo-test: SILENT SKIPS DETECTED"; echo '```';
              grep -F -- "— skipping" /tmp/cargo-test.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "## cargo-test: 0 skipped (DB-gated suite ran)" >> "$GITHUB_STEP_SUMMARY"

  # OpenAPI spec-from-code parity gate (incremental; see
  # WorkingDirectory/docs/improvements/02-api-contract-typegen.md).
  # Regenerates contracts/api/generated/mm_api_gen.yaml from the utoipa
  # annotations in crates/mm-api and fails when the checked-in file is
  # stale — i.e. a route/DTO changed without re-running the emitter:
  #   cargo run -p mm-api --bin mm-openapi
  spec-gen:
    runs-on: mm-runners
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Same minimal toolchain bootstrap as cargo-test (ARC runner image
      # has no C compiler); no postgres needed — the emitter only builds.
      - name: install build toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: regenerate OpenAPI spec
        run: cargo run -p mm-api --bin mm-openapi

      - name: fail on drift
        run: git diff --exit-code -- contracts/api/generated/

  # mm-switch is goroutine-heavy (relay/viewer/source fan-out) — run with the
  # race detector. ubuntu-latest: free for a public repo, has cgo+gcc out of
  # the box, and keeps load off the ARC pool. The in-tree ebml fork is a
  # separate Go module (own go.mod + `replace` directive), so `go test ./...`
  # from the service root does not reach it — second invocation required.
  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/mm-switch/go.mod
          cache-dependency-path: services/mm-switch/go.sum
      - name: go vet + test (mm-switch)
        working-directory: services/mm-switch
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: go test (internal-ebml-fork — separate module)
        working-directory: services/mm-switch/internal-ebml-fork
        run: go test -race -count=1 ./...
      - name: summary
        run: |
          echo "## go-test: mm-switch + ebml-fork passed (-race)" >> "$GITHUB_STEP_SUMMARY"
