name: deploy-lint
on:
  pull_request: { paths: ['deploy/**', '.github/workflows/deploy-lint.yml'] }
  push: { branches: [main], paths: ['deploy/**'] }
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck bats gettext-base jq
      - name: shellcheck
        run: |
          shopt -s nullglob
          files=(deploy/install.sh deploy/mmctl deploy/lib/*.sh deploy/test/*.sh)
          [ ${#files[@]} -eq 0 ] || shellcheck -x -e SC1090 -e SC2034 "${files[@]}"
      - name: bats
        run: |
          shopt -s nullglob
          t=(deploy/test/*.bats)
          [ ${#t[@]} -eq 0 ] || bats "${t[@]}"
