[package]
name = "mm-dns"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vendor DNS service for MatrixMedia -- lets customers claim <name>.matrixmedia.app subdomains."

[[bin]]
name = "mm-dns"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
# The workspace `sqlx` dependency already enables the `sqlite` feature
# (alongside `postgres`, for mm-db) -- see crates/mm-dns/src/store.rs module
# docs for the full rationale. No per-crate feature addition needed.
sqlx = { workspace = true }
# No argon2/bcrypt precedent exists anywhere in the workspace (checked); new
# mm-dns-only dependency per the task brief's documented fallback. See
# crates/mm-dns/src/store.rs module docs for the full rationale.
argon2 = "0.5"
# Already a workspace dependency (rand = "0.9" at the repo root, used by
# mm-ads and mm-core -- see crates/mm-dns/src/api.rs module docs). Used here
# to generate the random httpreq_user/httpreq_pass/claim_token creds.
rand = { workspace = true }

[dev-dependencies]
# HTTP mocking for Cloudflare v4 contract tests: no existing generic
# HTTP-mock dev-dependency was found anywhere in the workspace (checked
# every crate's Cargo.toml for wiremock/mockito/httpmock), so this is a
# new mm-dns-only dev-dependency per the task brief's documented fallback.
# See crates/mm-dns/src/cloudflare.rs module docs for the full rationale.
wiremock = { workspace = true }
# tempfile sqlite paths for store.rs tests (already a workspace dependency,
# used the same way by crates/mm-core/src/media.rs).
tempfile = { workspace = true }
# `Router::oneshot` in crates/mm-dns/src/api.rs's tests -- `oneshot` lives
# behind tower's `util` feature (not enabled by the workspace's bare
# `tower = "0.5"`), so it's added here as an mm-dns-only dev-dependency.
tower = { version = "0.5", features = ["util"] }
