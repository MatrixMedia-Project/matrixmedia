name: helm-validate

# Lint + dry-render the matrixmedia-stack umbrella chart under both
# env overlays. Catches chart-side syntax errors, missing values,
# broken template logic, and dependency mismatches BEFORE ArgoCD has
# a chance to fail-sync them on the cluster.
#
# Triggers only on changes under deploy/ + this workflow itself, so
# chart iteration is fast and unrelated changes don't burn runners.

on:
  pull_request:
    branches: [main, development]
    paths:
      - 'deploy/helm/**'
      - '.github/workflows/helm-validate.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/helm/**'
  workflow_dispatch:

# A new push to a pull request cancels that PR's older, now-superseded run of
# this workflow. The group carries the workflow name and the PR number, so other
# PRs and other workflows are never touched. Every other event (pushes to main or
# development, v* tags, workflow_dispatch) gets a group of its own run id, so it
# is never cancelled and never waits behind another run: a shared group would keep
# only one run pending and cancel the rest, even with cancel-in-progress off.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-render:
    runs-on: mm-runners
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: helm dependency build (umbrella file:// subcharts)
        run: helm dependency build deploy/helm/matrixmedia-stack

      - name: helm lint
        run: helm lint deploy/helm/matrixmedia-stack

      - name: render dev overlay
        run: |
          helm template mm-dev deploy/helm/matrixmedia-stack \
            -f deploy/argocd/values/values-dev.yaml \
            > /tmp/render-dev.yaml
          echo "dev overlay rendered: $(wc -l < /tmp/render-dev.yaml) lines"

      - name: render prod overlay (all subcharts off)
        run: |
          helm template mm-prod deploy/helm/matrixmedia-stack \
            -f deploy/argocd/values/values-prod.yaml \
            > /tmp/render-prod.yaml
          echo "prod overlay rendered: $(wc -l < /tmp/render-prod.yaml) lines"
