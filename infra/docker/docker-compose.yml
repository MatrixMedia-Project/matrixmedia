# MatrixMedia Development Stack
# Usage:
#   cp .env.example .env   # then edit as needed
#   docker compose up -d
#
# Services: LiveKit (SFU), coturn (TURN/STUN), MinIO (S3-compatible),
#           Synapse (Matrix homeserver)
#
# mm-core is commented out until the Rust binary is built.

services:
  # --------------------------------------------------------------------------
  # mm-core  --  MatrixMedia backend (uncomment when binary exists)
  # --------------------------------------------------------------------------
  # mm-core:
  #   build:
  #     context: ../..
  #     dockerfile: infra/docker/Dockerfile
  #   ports:
  #     - "6167:6167"    # Client / Widget API
  #     - "6168:6168"    # Admin API (bind 127.0.0.1 in production)
  #     - "9090:9090"    # Prometheus metrics
  #   env_file: .env
  #   volumes:
  #     - ./data:/data
  #   depends_on:
  #     livekit:
  #       condition: service_healthy
  #     synapse:
  #       condition: service_healthy
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:6167/_mm/admin/v1/health"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 15s
  #   restart: unless-stopped

  # --------------------------------------------------------------------------
  # LiveKit  --  SFU for WebRTC media transport
  # --------------------------------------------------------------------------
  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"                       # HTTP / WebSocket signaling
      - "7881:7881"                       # TCP media (TURN-over-TCP fallback)
      - "7882:7882/udp"                   # UDP media (primary)
      - "52500-52510:52500-52510/udp"     # WebRTC media UDP range (small dev range)
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    command: --config /etc/livekit.yaml --dev --bind 0.0.0.0
    environment:
      LIVEKIT_KEYS: "devkey: devsecret"
    depends_on:
      coturn:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7880"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # coturn  --  STUN / TURN server for NAT traversal
  # --------------------------------------------------------------------------
  # NOTE: For usage beyond LAN, set --external-ip=<YOUR_PUBLIC_IP>/<LOCAL_IP>
  #       e.g. --external-ip=203.0.113.1/10.0.0.5
  coturn:
    image: coturn/coturn:latest
    ports:
      - "3478:3478"                       # STUN / TURN (TCP)
      - "3478:3478/udp"                   # STUN / TURN (UDP)
      - "5349:5349"                       # TURN over TLS
      - "52520-52530:52520-52530/udp"     # TURN relay range (small dev range)
    command: >-
      -n
      --log-file=stdout
      --realm=mm.local
      --min-port=52520
      --max-port=52530
      --user=mm:mm_turn_secret
      --lt-cred-mech
      --fingerprint
      --no-cli
    # For non-LAN usage, add:
    #   --external-ip=<YOUR_PUBLIC_IP>/<YOUR_LOCAL_IP>
    # to the command above, or override via docker compose CLI.
    healthcheck:
      test: ["CMD-SHELL", "pgrep turnserver || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # MinIO  --  S3-compatible object storage
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # MinIO web console
    environment:
      MINIO_ROOT_USER: mm_storage
      MINIO_ROOT_PASSWORD: mm_storage_dev
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Synapse  --  Matrix homeserver
  # --------------------------------------------------------------------------
  # Generates Synapse's config ONCE, on a fresh volume, then exits.
  #
  # Synapse does not self-configure: with an empty /data it looks for homeserver.yaml,
  # does not find one, and exits. Nothing in this stack ever ran `generate`, so a fresh
  # clone's Synapse crash-looped forever. It only worked on the owner's machine because a
  # LEGACY VOLUME there already held a homeserver.yaml from a long-ago manual run — i.e.
  # the stack was only ever reproducible on one laptop.
  #
  # Idempotent: if homeserver.yaml already exists it changes nothing, so existing volumes
  # (including the owner's) are untouched.
  synapse-init:
    image: matrixdotorg/synapse:latest
    environment:
      SYNAPSE_SERVER_NAME: localhost
      SYNAPSE_REPORT_STATS: "no"
    volumes:
      - synapsedata:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # Existence is the guard, so a pre-existing / legacy config (the one a long-lived
        # machine already has) is never touched. That means the file must only ever APPEAR
        # complete: generate writes to a temp path, the dev settings are appended there, and
        # only then is it moved into place. `mv` within one filesystem is atomic.
        #
        # Appending to /data/homeserver.yaml directly would be a trap: interrupt the init
        # (Ctrl-C, OOM) between `generate` and the append and the volume is left holding a
        # config with no registration, no appservice and no public_baseurl — which every
        # later `up` would then see, trust, and never repair. Only `down -v` would fix it,
        # and nothing would tell you that.
        if [ -f /data/homeserver.yaml ]; then
          echo "[synapse-init] homeserver.yaml exists — leaving it alone"
          exit 0
        fi
        echo "[synapse-init] fresh volume — generating config"

        TMP=/data/.homeserver.yaml.partial
        rm -f "$$TMP"
        SYNAPSE_CONFIG_PATH="$$TMP" /start.py generate

        # Dev-only settings. A local stack that cannot register a user is useless, and
        # public_baseurl must be the address the CLIENT will use — not 'localhost', which
        # is a different machine entirely when the client is a phone on the LAN.
        {
          echo ""
          echo "# --- appended by synapse-init (local dev only) ---"
          echo "enable_registration: true"
          echo "enable_registration_without_verification: true"
          echo "public_baseurl: \"${MM_PUBLIC_HOST:-http://localhost:8008}/\""
          echo "suppress_key_server_warning: true"
          echo "app_service_config_files:"
          echo "  - /synapse_conf/mm_appservice.yaml"
          echo "# search_all_users: without it a new user can find NOBODY in the directory."
          echo "user_directory:"
          echo "  enabled: true"
          echo "  search_all_users: true"
        } >> "$$TMP"

        mv -f "$$TMP" /data/homeserver.yaml
        echo "[synapse-init] done"
    restart: "no"

  synapse:
    image: matrixdotorg/synapse:latest
    depends_on:
      synapse-init:
        condition: service_completed_successfully
    ports:
      - "8008:8008"
    environment:
      SYNAPSE_SERVER_NAME: localhost
      SYNAPSE_REPORT_STATS: "no"
    volumes:
      - synapsedata:/data
      - ./mm_appservice.yaml:/synapse_conf/mm_appservice.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/_matrix/client/versions"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Element Call  --  MatrixRTC SPA (WebRTC + LiveKit) embedded by clients
  # --------------------------------------------------------------------------
  # Hosts the Element Call static SPA so iOS / Android / Web clients can
  # embed it via WKWebView / WebView / iframe. The MatrixRTC stack uses
  # the LiveKit service above as its SFU; signaling rides on Matrix room
  # state (m.rtc.member events, MSC4143).
  #
  # Public route at https://call.steegler.com → 80 inside the container.
  # For dev, the container is reachable at http://element-call:8080
  # within the docker network.
  element-call:
    # PROFILE prod-edge. Not started by a plain `docker compose up`.
    #
    # This service joins the EXTERNAL `traefik` network, and an external network that does
    # not exist makes compose fail outright:
    #
    #   network traefik declared as external, but could not be found
    #
    # On a fresh clone there is no Traefik, so the whole stack refused to start — the
    # minute-5 blocker for every new contributor. Behind a profile, `docker compose up`
    # simply omits it; `--profile prod-edge` brings it back for anyone who does run Traefik.
    profiles: ["prod-edge"]
    image: ghcr.io/element-hq/element-call:latest
    # Direct host port kept for local debugging (`http://localhost:8090`).
    # In production, traffic comes in via Traefik on call.steegler.com.
    ports:
      - "8090:8080"
    environment:
      # IMPORTANT: these URLs are baked into the SPA's config.json and
      # served to end-user browsers / WKWebViews — they must be the
      # PUBLIC URLs reachable from the device, not docker network names.
      # Override per environment via .env (ELEMENT_CALL_PUBLIC_*).
      DEFAULT_HOMESERVER: ${ELEMENT_CALL_PUBLIC_HOMESERVER_URL:-https://matrix.steegler.com}
      LIVEKIT_SERVICE_URL: ${ELEMENT_CALL_PUBLIC_LIVEKIT_URL:-wss://livekit.steegler.com}
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.element-call.rule=Host(`call.steegler.com`)"
      - "traefik.http.routers.element-call.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.element-call.tls=true"
      - "traefik.http.routers.element-call.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.element-call.loadbalancer.server.port=8080"
    depends_on:
      synapse:
        condition: service_started
      livekit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ | grep -q 'Element Call' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Sygnal  --  Matrix push gateway (APNs / FCM bridge for Synapse)
  # --------------------------------------------------------------------------
  # Synapse posts notifications here; Sygnal forwards to APNs (and later
  # FCM). The iOS client registers a pusher with `url:
  # http://sygnal:5000/_matrix/push/v1/notify` and `app_id` = either
  # `com.steegler.matrixmedia.prod.dev` (sandbox) or `.prod` (production).
  #
  # Secrets: ../../DANGER_ZONE holds the .pem cert+key bundles; mounted
  # read-only into /etc/sygnal/secrets. DANGER_ZONE is .gitignored.
  sygnal:
    # PROFILE prod-edge — joins the external `traefik` network. See element-call above.
    profiles: ["prod-edge"]
    # Stock Sygnal + our call-only APNs pushkin for the iOS .voip
    # app_ids (infra/docker/Dockerfile.sygnal + sygnal/callonly_apns.py).
    # Was `image: matrixdotorg/sygnal:latest`; the build only layers one
    # .py onto PYTHONPATH — behaviour is identical for every non-.voip
    # app_id. SYGNAL_TAG build-arg pins the upstream base.
    build:
      context: .
      dockerfile: Dockerfile.sygnal
      args:
        SYGNAL_TAG: latest
    # Direct host port kept for local debugging (`curl localhost:5000/health`).
    # In production, traffic comes in via Traefik on sygnal.steegler.com.
    ports:
      - "5000:5000"
    volumes:
      - ./sygnal.yaml:/sygnal.yaml:ro
      - ../../DANGER_ZONE:/etc/sygnal/secrets:ro
    environment:
      SYGNAL_CONF: /sygnal.yaml
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.sygnal.rule=Host(`sygnal.steegler.com`)"
      - "traefik.http.routers.sygnal.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.sygnal.tls=true"
      - "traefik.http.routers.sygnal.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.sygnal.loadbalancer.server.port=5000"
    healthcheck:
      # The matrixdotorg/sygnal image ships a default HEALTHCHECK that
      # uses curl, but neither curl nor wget is in the container — so
      # the default check never passes and Traefik refuses to route to
      # the container. Use python3 (which IS present) to probe /health.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      synapse:
        condition: service_started
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Redis  --  Shared cache layer (entitlements, rate limiting, trending)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-bookworm
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # PostgreSQL  --  Monetization database (Phase 7a+)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-bookworm
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: matrixmedia
      POSTGRES_USER: matrixmedia
      POSTGRES_PASSWORD: "${MM_POSTGRES_PASSWORD:-mm_dev_password}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matrixmedia"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

# ----------------------------------------------------------------------------
# Networks
# ----------------------------------------------------------------------------
networks:
  default:
    # Default docker-compose network; service-to-service traffic uses this.
  traefik:
    # External network where the existing Traefik instance lives. Only the
    # services that opt-in (element-call, sygnal) join it. The other
    # services keep their previous network setup unchanged so existing
    # routes / direct port access don't break.
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

# ----------------------------------------------------------------------------
# Named volumes
# ----------------------------------------------------------------------------
volumes:
  miniodata:
    driver: local
  synapsedata:
    driver: local
  pgdata:
    driver: local
