[package]
name = "mm-fleet"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mm-core = { workspace = true }
mm-db = { workspace = true }

async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
# check_endpoint parses the sealed endpoint; already in the lockfile via reqwest.
url = "2"
# Provider tokens are sealed in the browser to the runner's key (HPKE, RFC 9180).
# hpke's default `getrandom` feature supplies the OS RNG (`getrandom::SysRng`), so no
# direct rand_core dependency is needed.
hpke = { version = "0.14", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
# To read a metric's label values back in a test (the Collector trait).
prometheus = { workspace = true }
# test_support is feature-gated in mm-db and never enabled in production builds;
# consumers turn it on here.
mm-db = { workspace = true, features = ["test-support"] }
# A stand-in Scaleway for the provider tests: the shapes are copied from the
# published SDK, so a drift in the real API shows up as a parse failure here.
axum = { workspace = true }
