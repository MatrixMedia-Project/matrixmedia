server {
    listen 80;
    server_name _;

    # Prevent stale HTML caching (JS/CSS use hashed filenames)
    add_header Cache-Control "no-cache" always;

    # Relative Location headers: behind Traefik TLS nginx sees plain http and would
    # otherwise redirect to http://... (an extra, insecure hop).
    absolute_redirect off;

    # Recordings (served from shared volume)
    location /_mm/recordings/ {
        alias /recordings/;
        add_header Access-Control-Allow-Origin *;
    }

    # Landing page (served at root via Traefik)
    location /_mm/landing/ {
        alias /usr/share/nginx/html/landing/;
        try_files $uri $uri/ /_mm/landing/index.html;
    }

    # Brand assets
    location /_mm/brand/ {
        alias /usr/share/nginx/html/brand/;
    }

    # Platform Hub (landing page at /_mm/)
    location = /_mm/ {
        alias /usr/share/nginx/html/hub/;
        index index.html;
    }
    location /_mm/hub/ {
        alias /usr/share/nginx/html/hub/;
        try_files $uri $uri/ /hub/index.html;
    }

    # FluffyChat MM (SPA)
    location = /_mm/chat { return 301 /_mm/chat/; }

    # A root without its trailing slash would otherwise fall through to a 404.
    location = /_mm/recordings { return 301 /_mm/recordings/; }
    location = /_mm/landing { return 301 /_mm/landing/; }
    location = /_mm/brand { return 301 /_mm/brand/; }
    location = /_mm/hub { return 301 /_mm/hub/; }
    location = /_mm/dashboard { return 301 /_mm/dashboard/; }
    location = /_mm/viewer { return 301 /_mm/viewer/; }
    location = /_mm/demo { return 301 /_mm/demo/; }
    location = /_mm/live { return 301 /_mm/live/; }
    location = /_mm/studio { return 301 /_mm/studio/; }
    location = /_mm/operator { return 301 /_mm/operator/; }
    location = /_mm/playground { return 301 /_mm/playground/; }
    location = /_mm/federation { return 301 /_mm/federation/; }
    location = /_mm/mobile { return 301 /_mm/mobile/; }
    location = /_mm/ads { return 301 /_mm/ads/; }
    location /_mm/chat/ {
        alias /usr/share/nginx/html/chat/;
        try_files $uri $uri/ /_mm/chat/index.html;
    }

    # Dashboard (SPA)
    location /_mm/dashboard/ {
        alias /usr/share/nginx/html/dashboard/;
        try_files $uri $uri/ /_mm/dashboard/index.html;
    }

    # Viewer (SPA)
    location /_mm/viewer/ {
        alias /usr/share/nginx/html/viewer/;
        try_files $uri $uri/ /_mm/viewer/index.html;
    }

    # Demo client (original static demo)
    location /_mm/demo/ {
        alias /usr/share/nginx/html/demo/;
    }

    # mm-live (SPA): viewer-side demo platform
    location /_mm/live/ {
        alias /usr/share/nginx/html/live/;
        try_files $uri $uri/ /_mm/live/index.html;
    }

    # Creator Studio (SPA)
    location /_mm/studio/ {
        alias /usr/share/nginx/html/studio/;
        try_files $uri $uri/ /_mm/studio/index.html;
    }

    # Operator Console (SPA)
    location /_mm/operator/ {
        alias /usr/share/nginx/html/operator/;
        try_files $uri $uri/ /_mm/operator/index.html;
    }

    # Widget Playground (static)
    location /_mm/playground/ {
        alias /usr/share/nginx/html/playground/;
    }

    # Federation Simulator (static)
    location /_mm/federation/ {
        alias /usr/share/nginx/html/federation/;
    }

    # Mobile Demo Preview (static)
    location /_mm/mobile/ {
        alias /usr/share/nginx/html/mobile/;
    }

    # Ad media: converted renditions (internal spec 2026-10-11 §5.10) and the legacy files.
    #
    # This is the SAME origin as /_mm/chat and /_mm/dashboard, and these directories are written by
    # the media worker (a sandboxed process that parses untrusted uploads). A compromised worker
    # must not be able to plant an .html or .svg here and get stored XSS on that origin, so:
    #   - only .webm and .mp4 are served; everything else under the prefix, directories included, is a
    #     404 (the `return 404` runs only when the nested location below does not match);
    #   - the type comes from a two-entry table, never nginx's full mime.types, and the fallback is
    #     opaque bytes;
    #   - nosniff, and a CSP that grants nothing (`sandbox` with no allow-* tokens), are sent on
    #     every response, errors included.
    # `^~` makes both prefixes final: a regex location added later (for example a generic
    # `location ~* \.(js|css)$`) must never take precedence over them. The longer /r/ prefix still wins
    # for its paths.
    # add_header in a location REPLACES every add_header inherited from the server block (including its
    # no-cache), so each header these paths need is declared here again. Cache-Control has no `always`
    # on purpose: a 404 for a rendition that is not published yet must not be cached for a year.
    # No directory listings.

    # Converted renditions: content-addressed paths that are never rewritten, so they cache forever.
    # The nested location inherits alias, types and the headers from this one.
    location ^~ /_mm/ads/r/ {
        alias /usr/share/nginx/html/ads/r/;
        autoindex off;
        types { video/webm webm; video/mp4 mp4; }
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff" always;
        # The CSP allows the media itself and nothing else (no scripts). Not `sandbox`, and not
        # `default-src 'none'` alone: Chromium then refuses to play the file when it is opened
        # directly, which is what the dashboard's preview link does.
        add_header Content-Security-Policy "default-src 'none'; media-src 'self'" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin *;
        return 404;
        location ~ \.(webm|mp4)$ { }
    }

    # Ad inventory (consumed by mm-switch and viewers): the legacy {id}.webm files.
    location ^~ /_mm/ads/ {
        alias /usr/share/nginx/html/ads/;
        autoindex off;
        types { video/webm webm; video/mp4 mp4; }
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff" always;
        # The CSP allows the media itself and nothing else (no scripts). Not `sandbox`, and not
        # `default-src 'none'` alone: Chromium then refuses to play the file when it is opened
        # directly, which is what the dashboard's preview link does.
        add_header Content-Security-Policy "default-src 'none'; media-src 'self'" always;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin *;
        return 404;
        location ~ \.(webm|mp4)$ { }
    }

    # Privacy policy (static page; served at /privacy and /privacy.html).
    location = /privacy {
        alias /usr/share/nginx/html/privacy.html;
        default_type text/html;
        add_header Cache-Control "no-cache" always;
    }
    location = /privacy.html {
        alias /usr/share/nginx/html/privacy.html;
        default_type text/html;
        add_header Cache-Control "no-cache" always;
    }

    # CSAE — child safety standards (Google Play / Apple compliance).
    location = /csae {
        alias /usr/share/nginx/html/csae.html;
        default_type text/html;
        add_header Cache-Control "no-cache" always;
    }
    location = /csae.html {
        alias /usr/share/nginx/html/csae.html;
        default_type text/html;
        add_header Cache-Control "no-cache" always;
    }

    # Push Gateway public doc (operator-facing).
    location = /push {
        alias /usr/share/nginx/html/push.html;
        default_type text/html;
        add_header Cache-Control "no-cache" always;
    }
    location = /push.html {
        alias /usr/share/nginx/html/push.html;
        default_type text/html;
        add_header Cache-Control "no-cache" always;
    }

    # Health check
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Matrix federation well-known.
    # MM_DOMAIN is the Matrix server_name; federation lives at matrix.MM_DOMAIN:443.
    location = /.well-known/matrix/server {
        default_type application/json;
        add_header Content-Type application/json always;
        add_header Access-Control-Allow-Origin * always;
        return 200 '{"m.server":"matrix.${MM_DOMAIN}:443"}';
    }

    # Matrix client well-known.
    location = /.well-known/matrix/client {
        default_type application/json;
        add_header Content-Type application/json always;
        add_header Access-Control-Allow-Origin * always;
        return 200 '{"m.homeserver":{"base_url":"https://matrix.${MM_DOMAIN}/"}}';
    }
}
