# MatrixMedia Helm Chart Values

replicaCount: 1

image:
  repository: ghcr.io/matrixmedia/mm-core
  pullPolicy: IfNotPresent
  tag: ""  # Defaults to chart appVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# --- Core Configuration ---
config:
  # Server
  server:
    listenPort: 6167
    adminPort: 6168
    metricsPort: 9090
    drainTimeoutSeconds: 30
    logLevel: "info"

  # Database
  database:
    # "sqlite" or "postgres"
    type: postgres
    # PostgreSQL connection string (used when type=postgres)
    url: "postgres://mm:password@postgresql:5432/matrixmedia"
    maxConnections: 20
    # SQLite path (used when type=sqlite, NOT recommended for k8s)
    # sqlitePath: "/data/matrixmedia.db"

  # Matrix homeserver
  matrix:
    homeserverUrl: "http://synapse:8008"
    serverName: "example.org"
    botLocalpart: "mmbot"
    botDisplayName: "MatrixMedia Bot"

  # SFU
  sfu:
    adapter: "livekit"
    livekit:
      url: "wss://livekit.example.com"

  # Storage
  storage:
    backend: "local"  # "local" or "s3"
    localPath: "/data/media"
    s3:
      endpoint: ""
      bucket: "matrixmedia"
      region: "us-east-1"
      pathStyle: false

  # Widget
  widget:
    enabled: true
    dir: "/app/widget"

  # CDN (Phase 2+)
  cdn:
    enabled: false
    baseUrl: ""

  # CORS
  corsOrigins: []

# --- Secrets (via k8s Secret, not in values) ---
secrets:
  # These should be provided via --set or external secret management
  jwtSigningKey: ""
  adminToken: ""
  matrixAsToken: ""
  matrixHsToken: ""
  sfuApiKey: ""
  sfuApiSecret: ""
  # S3 credentials (if storage.backend=s3)
  s3AccessKey: ""
  s3SecretKey: ""
  # CDN signing key (Phase 2+)
  cdnSigningKey: ""

# --- Services ---
service:
  type: ClusterIP
  clientPort: 6167
  adminPort: 6168
  metricsPort: 9090

# --- Ingress ---
ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/proxy-body-size: "100m"
  hosts:
    - host: mm.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: mm-tls
    #   hosts:
    #     - mm.example.com

# --- Autoscaling ---
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# --- Pod Disruption Budget ---
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# --- Resources ---
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# --- Probes ---
livenessProbe:
  httpGet:
    path: /_mm/admin/v1/health
    port: admin
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /_mm/admin/v1/health
    port: admin
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3

startupProbe:
  httpGet:
    path: /_mm/admin/v1/health
    port: admin
  failureThreshold: 30
  periodSeconds: 5

# --- Init containers ---
migrations:
  enabled: true
  # Runs mm-core migrate before the main container starts

# --- Persistence (for SQLite mode only, not recommended) ---
persistence:
  enabled: false
  storageClass: ""
  size: 5Gi
  accessModes:
    - ReadWriteOnce

# --- Network Policy ---
networkPolicy:
  enabled: true

# --- Pod annotations/labels ---
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
