[package]
name = "mm-fakestripe"
version = "0.2.1"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Fake Stripe API server for MatrixMedia integration testing. Implements the minimum surface mm-core uses (accounts, account_links, checkout sessions) and fires signed webhooks back to mm-core."

[[bin]]
name = "mm-fakestripe"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
# fakeln issues real signed BOLT11 invoices so mm-core's parse/amount/proof
# checks exercise the genuine code path (same pins as mm-payment).
lightning-invoice = { version = "0.34", default-features = false, features = ["std"] }
bitcoin = { version = "0.32", default-features = false, features = ["std"] }

[dev-dependencies]
# Match workspace TLS feature (rustls) so feature unification under
# `cargo test --all` doesn't surface "multiple TLS implementations".
stripe = { package = "async-stripe", version = "0.41", default-features = false, features = ["runtime-tokio-hyper-rustls", "checkout", "connect", "webhook-events"] }
mm-payment = { workspace = true }
