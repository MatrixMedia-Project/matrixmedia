openapi: 3.1.0
info:
  title: MatrixMedia API
  description: |-
    MatrixMedia is an independent media streaming service for the Matrix ecosystem. It installs as a sidecar next to any Matrix homeserver and provides live audio/video streaming, VoD, and screen sharing.

    GENERATED SPEC — produced from the Axum handlers and serde DTOs in `crates/mm-api` by `cargo run -p mm-api --bin mm-openapi`. Do not edit by hand.

    Coverage: client streams/recordings module only so far; remaining modules are converted incrementally (the hand-written `mm_api_v1.yaml` still documents the rest).

    **Authentication:**
    - Client API endpoints require a Bearer MM JWT obtained via `/auth/token`.
    - Admin API endpoints require a Bearer shared secret configured at deployment.
    - The Appservice callback requires a Bearer `hs_token` issued by the homeserver.

    **Error envelope:**
    All non-2xx responses use a standard JSON envelope with `error` (machine-readable code), `message` (human-readable), and optional `retry_after_ms`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  version: 0.11.0
servers:
- url: http://localhost:6167
  description: Local development -- Client & Widget API
- url: http://localhost:6168
  description: Local development -- Admin API (localhost-only in production)
paths:
  /_mm/client/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: POST /auth/refresh -- Refresh an MM session JWT.
      description: |-
        1. Validates the refresh token.
        2. Issues a new session JWT + refresh token pair.
        3. Returns `{ mm_token, refresh_token, user_id, expires_in }`.
      operationId: auth_refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshRequest'
        required: true
      responses:
        '200':
          description: New MM session JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /_mm/client/v1/auth/token:
    post:
      tags:
      - auth
      summary: POST /auth/token -- Exchange Matrix OpenID for MM JWT.
      description: |-
        1. Validates the OpenID token against the appropriate homeserver:
           - If `matrix_server_name` matches the local server, validates against
             the configured homeserver (local flow).
           - Otherwise, if federation is enabled AND the remote server is
             allow-listed, validates against the remote homeserver.
        2. Issues an MM session JWT + refresh token.
        3. Returns `{ mm_token, refresh_token, user_id, expires_in }`.
      operationId: auth_token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
        required: true
      responses:
        '200':
          description: MM session JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: OpenID token rejected by the homeserver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /_mm/client/v1/recordings/{id}/captions/rerun:
    post:
      tags:
      - recordings
      summary: |-
        POST /recordings/:id/captions/rerun -- Reset the recording's English
        source caption row to `pending` so mm-caption-worker transcribes it
        again.
      description: |-
        Admin (operator) only: the demo role is refused, like every other
        acting admin endpoint. A caller without a Postgres backend gets 501
        (MM_FEATURE_DISABLED); an unknown recording id gets 404.
      operationId: rerun_recording_captions
      parameters:
      - name: id
        in: path
        description: Recording id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The source caption row is pending again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RerunCaptionsResponse'
        '401':
          description: Missing/invalid admin credential or demo role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Recording not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: No PostgreSQL backend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - admin_token: []
  /_mm/client/v1/recordings/{recording_id}:
    get:
      tags:
      - recordings
      summary: |-
        GET /recordings/:recording_id -- Get recording details.
        When advertising is enabled, includes `ad_policy` with pre-roll decision.
      description: |-
        Only the recording's host and members of its room see it. Anyone else gets
        the same 404 as for a recording that does not exist, as does a caller whose
        membership cannot be resolved.
      operationId: get_recording
      parameters:
      - name: recording_id
        in: path
        description: Recording id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Recording details (with ad_policy when advertising is enabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingResponse'
        '401':
          description: Missing/invalid MM JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Recording is tier-gated and the caller is not entitled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Recording not found, or the caller is neither its host nor in its room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
    delete:
      tags:
      - recordings
      summary: DELETE /recordings/:recording_id -- Delete a recording (host only).
      operationId: delete_recording
      parameters:
      - name: recording_id
        in: path
        description: Recording id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Recording deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          description: Missing/invalid MM JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not the recording host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Recording not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
  /_mm/client/v1/recordings/{recording_id}/paywall:
    put:
      tags:
      - recordings
      summary: |-
        PUT /recordings/{recording_id}/paywall -- Set (or clear) a
        recording's anonymous share-link Lightning price. Requires auth;
        host only. The recording counterpart of
        [`put_stream_paywall_price`].
      operationId: put_recording_paywall_price
      parameters:
      - name: recording_id
        in: path
        description: Recording id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPaywallPriceRequest'
        required: true
      responses:
        '200':
          description: The price as stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingPaywallPriceResponse'
        '400':
          description: paywall_price_sats is not positive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing/invalid MM JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not the recording host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Recording not found, or the caller is neither its host nor in its room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Monetization is not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
  /_mm/client/v1/recordings/{recording_id}/paywall/invoice:
    post:
      tags:
      - recordings
      summary: |-
        POST /recordings/{recording_id}/paywall/invoice -- A BOLT11 invoice
        for a priced recording's share-link paywall. No auth: the grant id
        in the body is the credential, checked exactly like the recording
        `public-view` 404 half. The recording counterpart of
        [`create_stream_paywall_invoice`].
      operationId: create_recording_paywall_invoice
      parameters:
      - name: recording_id
        in: path
        description: Recording id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaywallInvoiceRequest'
        required: true
      responses:
        '200':
          description: Paywall claim and BOLT11 invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaywallInvoiceResponse'
        '400':
          description: Recording has no Lightning paywall price
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Recording is subscription-gated, or the Lightning rail refused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Recording not found, not public, or the grant is unknown, revoked, expired, or for another recording
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          description: Host has no Lightning address and no Lightning provider is configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Monetization is not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /_mm/client/v1/recordings/{recording_id}/paywall/proof:
    post:
      tags:
      - recordings
      summary: |-
        POST /recordings/{recording_id}/paywall/proof -- Prove a recording
        paywall invoice settled by presenting its preimage. The recording
        counterpart of [`submit_stream_paywall_proof`].
      operationId: submit_recording_paywall_proof
      parameters:
      - name: recording_id
        in: path
        description: Recording id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaywallProofRequest'
        required: true
      responses:
        '200':
          description: Claim settled (or already settled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaywallProofResponse'
        '400':
          description: Preimage malformed or mismatched, or the claim expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such paywall claim for this grant and recording
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /_mm/client/v1/recordings/{recording_id}/paywall/status:
    post:
      tags:
      - recordings
      summary: |-
        POST /recordings/{recording_id}/paywall/status -- Poll a recording
        paywall claim. The recording counterpart of
        [`get_stream_paywall_status`].
      operationId: get_recording_paywall_status
      parameters:
      - name: recording_id
        in: path
        description: Recording id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaywallStatusRequest'
        required: true
      responses:
        '200':
          description: Claim status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaywallStatusResponse'
        '404':
          description: No such paywall claim for this grant and recording
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /_mm/client/v1/recordings/{recording_id}/public-view:
    post:
      tags:
      - recordings
      summary: |-
        POST /recordings/{recording_id}/public-view -- View a recording as an
        anonymous share-link holder. No auth: the grant id in the body is the
        credential.
      description: |-
        Admits the caller through [`authorize_public_recording`] (a public
        recording, a live grant for it, no subscription gate) and returns the
        same [`RecordingResponse`] as the member GET, minus the ad policy
        (there is no viewer identity to decide ads for). When the recording
        is Lightning-priced and the caller has not paid, the gate's
        `MM_PAYMENT_REQUIRED` refusal becomes a 200 with the playable URLs
        and captions withheld ([`RecordingResponse::withhold_url`]) — the
        metadata (title, thumbnail, `paywall_price_sats`) is what the viewer
        renders the paywall tile from. Every other refusal stays an error.
      operationId: public_view_recording
      parameters:
      - name: recording_id
        in: path
        description: Recording id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicJoinRequest'
        required: true
      responses:
        '200':
          description: Recording details for the share-link holder; playable URLs withheld while a Lightning price is unpaid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingResponse'
        '402':
          description: Recording is subscription-gated; anonymous viewers cannot subscribe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Recording not found, not public, or the grant is unknown, revoked, expired, or for another recording
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /_mm/client/v1/recordings/{recording_id}/share-grants:
    post:
      tags:
      - recordings
      summary: |-
        POST /recordings/{recording_id}/share-grants -- Mint a public share
        link for a recording. Requires auth; host only.
      description: |-
        1. The caller must see the recording ([`visible_recording_or_404`])
           and be its host, else 403.
        2. `link_access`, when given, must be `"members"` or `"public"` (else
           400) and becomes the recording's standing posture.
        3. The effective posture must be `"public"` (else 400): a grant for a
           members-only recording would authorize no one.
      operationId: create_recording_share_grant
      parameters:
      - name: recording_id
        in: path
        description: Recording id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShareGrantRequest'
        required: true
      responses:
        '200':
          description: Share grant minted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingShareGrantResponse'
        '400':
          description: link_access is not "members"/"public", or the recording's link access is not public
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing/invalid MM JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not the recording host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Recording not found, or the caller is neither its host nor in its room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
  /_mm/client/v1/recordings/{recording_id}/share-grants/{grant_id}:
    delete:
      tags:
      - recordings
      summary: |-
        DELETE /recordings/{recording_id}/share-grants/{grant_id} -- Revoke a
        recording's share link. Requires auth; host only. Revoking an
        already-revoked grant still succeeds.
      operationId: delete_recording_share_grant
      parameters:
      - name: recording_id
        in: path
        description: Recording id
        required: true
        schema:
          type: string
      - name: grant_id
        in: path
        description: Share grant id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Share grant revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeShareGrantResponse'
        '401':
          description: Missing/invalid MM JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not the recording host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Recording not found, or no such share grant for this recording
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
  /_mm/client/v1/rooms/{room_id}/recordings:
    get:
      tags:
      - recordings
      summary: GET /rooms/:room_id/recordings -- List ready recordings in a room.
      description: |-
        Lists every ready recording when the caller has joined the room. Anyone
        else gets only the recordings they host there, usually none. A failed
        membership lookup counts as "not joined". Rows the caller's tier does not
        cover keep their metadata but lose the playback URL.
      operationId: list_room_recordings
      parameters:
      - name: room_id
        in: path
        description: Matrix room ID (URL-encoded)
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of items to return (default 20, max 100).
        required: false
        schema:
          type: integer
          format: int64
      - name: before_id
        in: query
        description: Only return items older than this id (keyset pagination).
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Recordings in the room when the caller has joined it, otherwise only the caller's own (gated rows have playback URLs withheld)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingsResponse'
        '401':
          description: Missing/invalid MM JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Room unknown to MM
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
  /_mm/client/v1/rooms/{room_id}/streams:
    get:
      tags:
      - streams
      summary: GET /rooms/:room_id/streams -- List streams in a room.
      description: |-
        Returns the room's streams (all statuses, newest first, at most 50) when
        the caller has joined the room. Anyone else gets only the streams they
        host there, usually none. A failed membership lookup counts as "not
        joined". A room MM has never seen answers with an empty list, not 404.
      operationId: list_room_streams
      parameters:
      - name: room_id
        in: path
        description: Matrix room ID (URL-encoded)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Streams in the room when the caller has joined it; otherwise only the caller's own (empty when MM has never seen the room)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomStreamsResponse'
        '401':
          description: Missing/invalid MM JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
  /_mm/client/v1/streams:
    post:
      tags:
      - streams
      summary: POST /streams -- Create/start a stream. Requires auth.
      description: |-
        1. Validates the authenticated user.
        2. Gets or creates the room in DB.
        3. Checks no active stream exists (409 if one does).
        4. Creates an SFU room.
        5. Creates the stream in DB.
        6. Publishes stream state event to Matrix.
        7. Sends m.notice notification.
        8. Generates an SFU token for the host.
        9. Returns 201 with stream details + SFU token.
      operationId: create_stream
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStreamRequest'
        required: true
      responses:
        '201':
          description: Stream created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateStreamResponse'
        '401':
          description: Missing/invalid MM JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller lacks streaming permission or is suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A stream is already active in this room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: 'E2EE flag conflicts with server config: requested but disabled, or required but not requested (MM_FEATURE_DISABLED)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
  /_mm/client/v1/streams/active-mine:
    get:
      tags:
      - streams
      summary: GET /streams/active-mine -- live streams the caller can see.
      description: |-
        Returns the active streams in rooms the caller has joined, plus every
        active stream the caller hosts. Membership comes from Synapse's admin API
        (`GET /_synapse/admin/v1/users/{user_id}/joined_rooms`) and the filter runs
        in the database query, so no other room's id, title or host leaves the
        server.

        If membership cannot be resolved (no `MM_SYNAPSE_ADMIN_TOKEN`, or Synapse
        is failing) the response fails closed to the caller's own streams.
      operationId: list_active_mine
      responses:
        '200':
          description: Active streams in rooms the caller has joined, plus the streams the caller hosts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveStreamsResponse'
        '401':
          description: Missing/invalid MM JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
  /_mm/client/v1/streams/{id}:
    get:
      tags:
      - streams
      summary: GET /streams/:id -- Get stream details.
      description: |-
        Only the host and members of the stream's room see it; anyone else gets the
        same 404 as for a stream that does not exist.
      operationId: get_stream
      parameters:
      - name: id
        in: path
        description: Stream id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Stream details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamResponse'
        '401':
          description: Missing/invalid MM JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Stream not found, or the caller is neither its host nor in its room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
  /_mm/client/v1/streams/{id}/captions:
    get:
      tags:
      - streams
      summary: GET /streams/:id/captions -- The host's captions setting for this broadcast.
      operationId: get_stream_captions
      parameters:
      - name: id
        in: path
        description: Stream id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The broadcast's captions setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamCaptionsResponse'
        '401':
          description: Missing/invalid MM JWT or caller is not the host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Stream not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: No PostgreSQL backend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
    put:
      tags:
      - streams
      summary: |-
        PUT /streams/:id/captions -- Set the host's captions setting for this
        broadcast.
      description: |-
        Captions are a consent feature, not a wallet feature, so only the host
        may set it, and only while the broadcast is live.
      operationId: put_stream_captions
      parameters:
      - name: id
        in: path
        description: Stream id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetStreamCaptionsRequest'
        required: true
      responses:
        '200':
          description: The setting as stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamCaptionsResponse'
        '401':
          description: Missing/invalid MM JWT or caller is not the host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Stream not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Stream already ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: No PostgreSQL backend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
  /_mm/client/v1/streams/{id}/end:
    post:
      tags:
      - streams
      summary: POST /streams/:id/end -- End stream (host only). Requires auth.
      description: |-
        1. Validates the stream exists.
        2. Verifies the user is the host.
        3. Finalises the broadcast's open recordings (they become available as VODs) and
           releases its media resources.
        4. Updates stream status to "ended".
        5. Writes the terminal stream state event in Matrix and the newsfeed events.

        Ending a stream that is already ended succeeds; steps 4-5 are not repeated.
      operationId: end_stream
      parameters:
      - name: id
        in: path
        description: Stream id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Stream ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          description: Missing/invalid MM JWT or caller is not the host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Stream not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
  /_mm/client/v1/streams/{id}/join:
    post:
      tags:
      - streams
      summary: POST /streams/:id/join -- Join as viewer (returns SFU token). Requires auth.
      description: |-
        1. Admits the caller through [`authorize_viewer`]: membership (anyone but
           the host and members of its room gets 404), not ended, the content and
           tier gates, and capacity.
        2. Adds participant to DB.
        3. Generates SFU token with subscriber permissions.
        4. Returns SFU URL + token + participant ID.
      operationId: join_stream
      parameters:
      - name: id
        in: path
        description: Stream id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Viewer credentials for the stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinStreamResponse'
        '401':
          description: Missing/invalid MM JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Stream is tier-gated and the caller is not entitled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller's tier lacks can_join_live, or is below the stream's content gate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Stream not found, or the caller is neither its host nor in its room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Every seat is taken and the caller holds none
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Stream already ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
  /_mm/client/v1/streams/{id}/leave:
    post:
      tags:
      - streams
      summary: POST /streams/:id/leave -- Leave stream. Requires auth.
      operationId: leave_stream
      parameters:
      - name: id
        in: path
        description: Stream id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Left the stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          description: Missing/invalid MM JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Stream or participant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
  /_mm/client/v1/streams/{id}/participants:
    get:
      tags:
      - streams
      summary: GET /streams/:id/participants -- List participants.
      description: |-
        The viewer list names who is watching, so it is gated like the stream
        itself: only the host and members of the stream's room see it, and anyone
        else gets the same 404 as for a stream that does not exist.
      operationId: list_participants
      parameters:
      - name: id
        in: path
        description: Stream id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Current participants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantsResponse'
        '401':
          description: Missing/invalid MM JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Stream not found, or the caller is neither its host nor in its room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
  /_mm/client/v1/streams/{id}/paywall:
    put:
      tags:
      - streams
      summary: |-
        PUT /streams/{id}/paywall -- Set (or clear) a stream's anonymous
        share-link Lightning price. Requires auth; host only. Setting a
        price requires monetization; clearing one never does.
      operationId: put_stream_paywall_price
      parameters:
      - name: id
        in: path
        description: Stream id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPaywallPriceRequest'
        required: true
      responses:
        '200':
          description: The price as stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamPaywallPriceResponse'
        '400':
          description: paywall_price_sats is not positive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing/invalid MM JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not the stream host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Stream not found, or the caller is neither its host nor in its room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Monetization is not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
  /_mm/client/v1/streams/{id}/paywall/invoice:
    post:
      tags:
      - streams
      summary: |-
        POST /streams/{id}/paywall/invoice -- A BOLT11 invoice for a priced
        stream's share-link paywall. No auth: the grant id in the body is
        the credential, checked exactly like `public-join`'s 404 half.
        Subscription-gated streams refuse (402): never sell access the
        buyer still could not use.
      operationId: create_stream_paywall_invoice
      parameters:
      - name: id
        in: path
        description: Stream id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaywallInvoiceRequest'
        required: true
      responses:
        '200':
          description: Paywall claim and BOLT11 invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaywallInvoiceResponse'
        '400':
          description: Stream has no Lightning paywall price
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Stream is subscription-gated, or the Lightning rail refused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Stream not found, not public, or the grant is unknown, revoked, expired, or for another stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Stream already ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          description: Host has no Lightning address and no Lightning provider is configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Monetization is not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /_mm/client/v1/streams/{id}/paywall/proof:
    post:
      tags:
      - streams
      summary: |-
        POST /streams/{id}/paywall/proof -- Prove a stream paywall invoice
        settled by presenting its preimage. On the one true settlement the
        response carries the bearer access token for `public-join`.
      operationId: submit_stream_paywall_proof
      parameters:
      - name: id
        in: path
        description: Stream id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaywallProofRequest'
        required: true
      responses:
        '200':
          description: Claim settled (or already settled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaywallProofResponse'
        '400':
          description: Preimage malformed or mismatched, or the claim expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such paywall claim for this grant and stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /_mm/client/v1/streams/{id}/paywall/status:
    post:
      tags:
      - streams
      summary: |-
        POST /streams/{id}/paywall/status -- Poll a stream paywall claim.
        For LNBits-issued invoices this settles the claim once the provider
        reports payment, returning the access token on that poll only.
      operationId: get_stream_paywall_status
      parameters:
      - name: id
        in: path
        description: Stream id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaywallStatusRequest'
        required: true
      responses:
        '200':
          description: Claim status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaywallStatusResponse'
        '404':
          description: No such paywall claim for this grant and stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /_mm/client/v1/streams/{id}/public-join:
    post:
      tags:
      - streams
      summary: |-
        POST /streams/{id}/public-join -- Join as an anonymous viewer via a
        share link. No auth: the grant id in the body is the credential.
      description: |-
        1. Admits the caller through [`authorize_public_viewer`]: a public
           stream, a live grant for it, not ended, no subscription gate, the
           Lightning paywall settled when the stream is priced, capacity.
        2. Seats the viewer as `guest:{grant_id}:{join}` (one seat per browser)
           and returns the same credentials as the member join
           ([`issue_viewer_join`]).
      operationId: public_join
      parameters:
      - name: id
        in: path
        description: Stream id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicJoinRequest'
        required: true
      responses:
        '200':
          description: Viewer credentials for the stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinStreamResponse'
        '402':
          description: Stream is subscription-gated (MM_CONTENT_GATED), or priced and unpaid (MM_PAYMENT_REQUIRED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Stream not found, not public, or the grant is unknown, revoked, expired, or for another stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Every seat is taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Stream already ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /_mm/client/v1/streams/{id}/public-view:
    post:
      tags:
      - streams
      summary: |-
        POST /streams/{id}/public-view -- Stream info for an anonymous
        share-link holder. No auth: the grant id in the body is the credential.
      description: |-
        Admits the caller through [`authorize_public_stream_info`]: a public
        stream and a live grant for it, no subscription gate. A Lightning
        price does not block info — the response carries
        `paywall_price_sats` for the paywall sheet. Unlike `public-join` an
        ended stream is still viewable here (info only — the viewer shows its
        ended state), and reading info stamps nothing and takes no seat, so
        polling clients can call this while waiting for the stream to start.
        Returns the same [`StreamResponse`] as the member GET.
      operationId: public_view_stream
      parameters:
      - name: id
        in: path
        description: Stream id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicJoinRequest'
        required: true
      responses:
        '200':
          description: Stream details for the share-link holder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamResponse'
        '402':
          description: Stream is subscription-gated; anonymous viewers cannot subscribe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Stream not found, not public, or the grant is unknown, revoked, expired, or for another stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /_mm/client/v1/streams/{id}/record:
    post:
      tags:
      - recordings
      operationId: start_recording
      parameters:
      - name: id
        in: path
        description: Stream id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Server-side recording started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartRecordingResponse'
        '401':
          description: Missing/invalid MM JWT or caller is not the host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: 'MM_BALANCE_TOO_LOW: the broadcast''s balance does not cover it and recording is paused (demotion ladder)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Stream not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
    delete:
      tags:
      - recordings
      operationId: stop_recording
      parameters:
      - name: id
        in: path
        description: Stream id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Recording stopped
          content:
            application/json:
              schema: {}
        '401':
          description: Missing/invalid MM JWT or caller is not the host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Stream or active recording not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
  /_mm/client/v1/streams/{id}/resume:
    post:
      tags:
      - streams
      summary: |-
        POST /streams/:id/resume -- Re-mint HOST publish credentials for an
        existing ACTIVE stream so the original host can reconnect after an app
        crash / network drop without orphaning or duplicating the broadcast.
      description: |-
        Auth: the caller MUST be the stream's `host_user_id`. The stream must
        still be `active`. Reuses the existing SFU room, mm-switch source id, and
        Matrix state event -- a fresh SFU token + publisher token are issued for
        the SAME room, so viewers stay connected to the existing broadcast.
      operationId: resume_stream
      parameters:
      - name: id
        in: path
        description: Stream id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Fresh publish credentials for the still-active stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateStreamResponse'
        '401':
          description: Missing/invalid MM JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not the host or is suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Stream not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Stream already ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
  /_mm/client/v1/streams/{id}/rotate-key:
    post:
      tags:
      - streams
      summary: POST /streams/:id/rotate-key -- Rotate the E2EE key (host only).
      description: |-
        1. Verifies the stream exists, is E2EE-enabled, and the caller is the host.
        2. Generates a new key with `generation = prev_generation + 1`.
        3. Persists the new key (DB + history).
        4. Publishes an updated `com.matrixmedia.stream.e2ee_key` state event.
        5. Returns the new key so the caller can immediately re-key.
      operationId: rotate_stream_key
      parameters:
      - name: id
        in: path
        description: Stream id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: New E2EE key generated and published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateKeyResponse'
        '401':
          description: Missing/invalid MM JWT or caller is not the host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Stream not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Stream does not have E2EE enabled (MM_FEATURE_DISABLED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
  /_mm/client/v1/streams/{id}/share-grants:
    post:
      tags:
      - streams
      summary: |-
        POST /streams/{id}/share-grants -- Mint a public share link for a
        stream. Requires auth; host only.
      description: |-
        1. The caller must see the stream ([`visible_stream_or_404`]) and be its
           host, else 403.
        2. `link_access`, when given, must be `"members"` or `"public"` (else
           400) and becomes the stream's standing posture.
        3. The effective posture must be `"public"` (else 400): a grant for a
           members-only stream would authorize no one.
      operationId: create_share_grant
      parameters:
      - name: id
        in: path
        description: Stream id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShareGrantRequest'
        required: true
      responses:
        '200':
          description: Share grant minted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareGrantResponse'
        '400':
          description: link_access is not "members"/"public", or the stream's link access is not public
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing/invalid MM JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not the stream host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Stream not found, or the caller is neither its host nor in its room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
  /_mm/client/v1/streams/{id}/share-grants/{grant_id}:
    delete:
      tags:
      - streams
      summary: |-
        DELETE /streams/{id}/share-grants/{grant_id} -- Revoke a stream's
        share link. Requires auth; host only. Revoking an already-revoked
        grant still succeeds.
      operationId: delete_share_grant
      parameters:
      - name: id
        in: path
        description: Stream id
        required: true
        schema:
          type: string
      - name: grant_id
        in: path
        description: Share grant id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Share grant revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeShareGrantResponse'
        '401':
          description: Missing/invalid MM JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not the stream host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Stream not found, or no such share grant for this stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
  /_mm/client/v1/streams/{id}/transcode:
    get:
      tags:
      - streams
      summary: GET /streams/:id/transcode -- The host's transcode setting for this broadcast.
      operationId: get_stream_transcode
      parameters:
      - name: id
        in: path
        description: Stream id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The broadcast's transcode setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamTranscodeResponse'
        '401':
          description: Missing/invalid MM JWT or caller is not the host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Stream not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: No PostgreSQL backend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
    put:
      tags:
      - streams
      summary: |-
        PUT /streams/:id/transcode -- Set the host's transcode setting for this
        broadcast.
      description: |-
        Transcoding spends the host's balance, so only the host may set it, and only
        while the broadcast is live. `on` is also how a host opts back in after an
        operator released the broadcast's transcoder.
      operationId: put_stream_transcode
      parameters:
      - name: id
        in: path
        description: Stream id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetStreamTranscodeRequest'
        required: true
      responses:
        '200':
          description: The setting as stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamTranscodeResponse'
        '401':
          description: Missing/invalid MM JWT or caller is not the host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Stream not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Stream already ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: No PostgreSQL backend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
  /_mm/client/v1/turn-credentials:
    get:
      tags:
      - streams
      summary: GET /turn-credentials -- mint short-lived coturn REST credentials.
      description: |-
        Replaces the long-lived static TURN `username`/`password` that was hardcoded
        in every client binary/bundle. The client fetches this just before creating
        its `RTCPeerConnection`; on any non-2xx (including a server that predates
        this endpoint, or one with no secret configured) the client falls back to
        its static credential for one release.

        Requires `MM_TURN_SHARED_SECRET` (the same value coturn is given via
        `use-auth-secret` / `--static-auth-secret`); returns 404 when unset.
      operationId: get_turn_credentials
      responses:
        '200':
          description: Ephemeral coturn REST credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnCredentialsResponse'
        '401':
          description: Missing/invalid MM JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: TURN credentials not configured on this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
  /_mm/fleet/v1/streams/{id}/api/viewers:
    get:
      tags:
      - switch-proxy
      summary: GET /_mm/fleet/v1/streams/{id}/api/viewers
      description: |-
        Replaces the direct path's open `GET /api/viewers`, which returned every
        viewer id on the node to anyone who could reach it.

        Members-only like the stream itself: a caller who neither hosts it nor has
        joined its room gets what an unknown stream gets, a count of 0.
      operationId: proxy_viewer_count
      parameters:
      - name: id
        in: path
        description: Stream id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Connected viewer count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewerCountResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
  /_mm/fleet/v1/streams/{id}/api/viewers/offer:
    post:
      tags:
      - switch-proxy
      summary: POST /_mm/fleet/v1/streams/{id}/api/viewers/offer
      description: |-
        Admitted by [`admit_offer`] for members (exactly as `POST
        /streams/{id}/join` would refuse the caller), and by
        [`crate::client::authorize_anonymous_offer`] for anonymous share-link
        viewers: no member JWT, but the body carries the `grant_id` from their
        watch link and the `viewer_token` their `public-join` minted (plus
        `access_token` on a priced link). Either credential refuses exactly as
        its join would, so the proxy is never a way around the paywall.

        The stream id is in the path rather than inferred, because a viewer id is
        per-stream and mm-core must know which broadcast to place the viewer on.
      operationId: proxy_viewer_offer
      parameters:
      - name: id
        in: path
        description: Stream id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyOfferRequest'
        required: true
      responses:
        '200':
          description: The node's SDP answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyOfferResponse'
        '400':
          description: source_id names a source other than this stream's
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'No usable credential: neither a member JWT nor a body viewer token matching a live seat for grant_id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Stream is tier-gated and the caller is not entitled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller's tier lacks can_join_live, or is below the stream's content gate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Stream not found or not public; the grant is unknown, revoked, or expired; or the member caller is neither the host nor in the room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Every seat is taken and the caller holds none (members only; a guest's seat was taken at join)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Stream already ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: The proxy is off (fleet.proxy_viewers), or the switch or its auth secret is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The node rejected or could not answer the offer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - mm_jwt: []
components:
  schemas:
    ActiveStreamEntry:
      type: object
      required:
      - stream_id
      - room_id
      - host_user_id
      - participant_count
      - started_at
      properties:
        host_user_id:
          type: string
        participant_count:
          type: integer
          format: int32
          minimum: 0
        room_id:
          type: string
        started_at:
          type: string
        stream_id:
          type: string
        title:
          type:
          - string
          - 'null'
    ActiveStreamsResponse:
      type: object
      description: Response body for `GET /streams/active-mine`.
      required:
      - active_streams
      properties:
        active_streams:
          type: array
          items:
            $ref: '#/components/schemas/ActiveStreamEntry'
    AuthRefreshRequest:
      type: object
      description: Request body for `POST /auth/refresh`.
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
    AuthTokenRequest:
      type: object
      description: Request body for `POST /auth/token`.
      required:
      - openid_token
      properties:
        openid_token:
          $ref: '#/components/schemas/OpenIdToken'
    AuthTokenResponse:
      type: object
      description: Response body for `POST /auth/token` and `POST /auth/refresh`.
      required:
      - mm_token
      - refresh_token
      - user_id
      - expires_in
      properties:
        expires_in:
          type: integer
          format: int64
          minimum: 0
        mm_token:
          type: string
        refresh_token:
          type: string
        user_id:
          type: string
    CaptionOverride:
      type: string
      description: |-
        The per-broadcast caption setting (`mm_streams.captions_opt_in`).

        Same three string forms as [`mm_core::fleet::transcode::TranscodeOverride`]
        by design (streamer-facing `inherit|on|off` toggles look identical), but a
        separate type: captions have no release veto, so sharing the transcode
        type would smuggle fleet semantics into a consent column.
      enum:
      - inherit
      - on
      - off
    CreateShareGrantRequest:
      type: object
      description: Request body for `POST /streams/{id}/share-grants`.
      properties:
        link_access:
          type:
          - string
          - 'null'
          description: |-
            New standing link-access posture for the stream: `"members"` or
            `"public"`. When present it is applied before the grant is minted.
        ttl_secs:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Grant lifetime in seconds. Defaults to 86400 (24h) and is clamped
            to 60..=2592000 (1 minute..=30 days).
    CreateStreamRequest:
      type: object
      description: Request body for `POST /streams`.
      required:
      - room_id
      - media_type
      properties:
        e2ee:
          type: boolean
          description: Enable E2EE for this stream.
        media_type:
          type: string
          description: 'Media type: "audio", "video", or "screen".'
        min_tier:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Minimum subscription tier required to view (0 = open).
            If omitted, the creator's `default_stream_min_tier` is used.
        min_tier_level:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Per-content tier gate persisted on the stream row (V026).
            `None` = free (no behavior change); `Some(n)` = requires an
            active subscription at level >= n. Enforcement lands in a later
            stage; for now this value is persisted and echoed back on read.
        room_id:
          type: string
          description: Matrix room ID where the stream is hosted.
        title:
          type:
          - string
          - 'null'
          description: Optional stream title.
    CreateStreamResponse:
      type: object
      description: Response for `POST /streams`.
      required:
      - stream_id
      - sfu_url
      - sfu_token
      - state_event_id
      properties:
        e2ee:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/E2eeStreamInfo'
        sfu_token:
          type: string
        sfu_url:
          type: string
        state_event_id:
          type: string
        stream_id:
          type: string
        switch_publisher_token:
          type:
          - string
          - 'null'
          description: |-
            HMAC-signed publisher token for mm-switch authentication.
            Present only when both `switch_url` and `MM_SWITCH_AUTH_SECRET` are configured.
        switch_source_id:
          type:
          - string
          - 'null'
          description: The source id the host should publish as.
        switch_url:
          type:
          - string
          - 'null'
          description: |-
            mm-switch HTTP base URL. When present, the host SHOULD publish camera
            media directly to mm-switch via `POST {switch_url}/api/publish/offer`
            with `id = switch_source_id`. LiveKit is still connected for recording
            but viewers consume from mm-switch.
    E2eeStreamInfo:
      type: object
      required:
      - enabled
      - algorithm
      - key_id
      - key_generation
      - key_b64
      properties:
        algorithm:
          type: string
        enabled:
          type: boolean
        key_b64:
          type: string
        key_generation:
          type: integer
          format: int32
          minimum: 0
        key_id:
          type: string
    ErrorCode:
      type: string
      description: |-
        Error codes returned by the MatrixMedia API.

        All errors use the envelope:
        ```json
        { "error": "MM_NOT_FOUND", "message": "...", "retry_after_ms": null }
        ```
      enum:
      - MM_NOT_FOUND
      - MM_STREAM_ACTIVE
      - MM_STREAM_ENDED
      - MM_ROOM_FULL
      - MM_RATE_LIMITED
      - MM_SFU_UNAVAILABLE
      - MM_HOMESERVER_UNREACHABLE
      - MM_FORBIDDEN
      - MM_FEATURE_DISABLED
      - MM_INTERNAL
      - MM_MONETIZATION_DISABLED
      - MM_CREATOR_NOT_ONBOARDED
      - MM_INVALID_AMOUNT
      - MM_PAYMENT_FAILED
      - MM_WEBHOOK_INVALID
      - MM_INVALID_TOKEN
      - MM_INSUFFICIENT_TIER
      - MM_CONTENT_GATED
      - MM_PAYMENT_REQUIRED
      - MM_PERMISSION_DENIED
      - MM_TIER_TOO_LOW
      - MM_SUBSCRIPTIONS_DISABLED
      - MM_TIER_LIMIT_REACHED
      - MM_BALANCE_TOO_LOW
      - MM_INVALID_PAYMENT_PROVIDER
      - MM_INVALID_LIGHTNING_ADDRESS
      - MM_INVALID_REQUEST
      - MM_AD_CONFLICT
      - M_HONEYPOT_FILLED
      - M_USERNAME_RESERVED
      - M_LIMIT_EXCEEDED
      - M_USERNAME_INVALID
      - M_USERNAME_TAKEN
    ErrorResponse:
      type: object
      description: JSON-serializable error response envelope.
      required:
      - error
      - message
      properties:
        error:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        retry_after_ms:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    JoinStreamResponse:
      type: object
      description: Response for `POST /streams/{id}/join`.
      required:
      - sfu_url
      - sfu_token
      - participant_id
      properties:
        e2ee:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/E2eeStreamInfo'
        participant_id:
          type: string
        sfu_token:
          type: string
        sfu_url:
          type: string
        switch_source_id:
          type:
          - string
          - 'null'
        switch_url:
          type:
          - string
          - 'null'
        switch_viewer_id:
          type:
          - string
          - 'null'
          description: |-
            Server-assigned viewer id. SDK MUST use this exact value as `id` when
            calling `POST {switch_url}/api/viewers/offer`. mm-core uses the same
            id to route server-side operations (ad switching, etc.) to this viewer.
        switch_viewer_token:
          type:
          - string
          - 'null'
          description: |-
            HMAC-signed viewer token for mm-switch authentication.
            Present only when both `switch_url` and `MM_SWITCH_AUTH_SECRET` are configured.
    OkResponse:
      type: object
      description: Response for `POST /streams/{id}/leave` and `POST /streams/{id}/end`.
      required:
      - ok
      properties:
        ok:
          type: boolean
    OpenIdToken:
      type: object
      description: OpenID token body as issued by the Matrix client SDK.
      required:
      - access_token
      - token_type
      - matrix_server_name
      - expires_in
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          format: int64
          minimum: 0
        matrix_server_name:
          type: string
        token_type:
          type: string
    ParticipantEntry:
      type: object
      description: A single participant entry.
      required:
      - id
      - user_id
      - role
      - joined_at
      properties:
        id:
          type: string
        joined_at:
          type: string
        role:
          type: string
        user_id:
          type: string
    ParticipantsResponse:
      type: object
      description: Response for `GET /streams/{id}/participants`.
      required:
      - participants
      properties:
        participants:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantEntry'
    PaywallInvoiceRequest:
      type: object
      description: |-
        Request body for the paywall invoice endpoints
        (`POST /streams/{id}/paywall/invoice`,
        `POST /recordings/{recording_id}/paywall/invoice`).
      required:
      - grant_id
      properties:
        grant_id:
          type: string
          description: The share grant id from the share link.
    PaywallInvoiceResponse:
      type: object
      description: A fresh paywall claim and the invoice that settles it.
      required:
      - claim_id
      - bolt11
      - payment_hash
      - amount_sats
      - expires_at
      - is_mock
      properties:
        amount_sats:
          type: integer
          format: int64
        bolt11:
          type: string
          description: |-
            BOLT11 invoice for exactly `amount_sats` (amount-asserted by the
            server before it is handed out).
        claim_id:
          type: string
        expires_at:
          type: string
          description: Claim expiry, RFC 3339.
        is_mock:
          type: boolean
          description: |-
            The invoice came from a mock provider (sandbox); clients must
            badge it, never present it as real money.
        payment_hash:
          type: string
    PaywallProofRequest:
      type: object
      description: Request body for the paywall proof endpoints.
      required:
      - grant_id
      - claim_id
      - preimage
      properties:
        claim_id:
          type: string
        grant_id:
          type: string
        preimage:
          type: string
          description: |-
            Hex-encoded BOLT11 preimage (64 chars / 32 raw bytes) from the
            paying wallet.
    PaywallProofResponse:
      type: object
      description: Response for the paywall proof endpoints.
      required:
      - claim_id
      - status
      properties:
        access_token:
          type:
          - string
          - 'null'
          description: |-
            Bearer access token, present exactly once: on the proof (or
            status poll) that settles the claim. The server stores only its
            hash, so clients must persist it immediately — it cannot be
            re-issued.
        claim_id:
          type: string
        status:
          type: string
    PaywallStatusRequest:
      type: object
      description: Request body for the paywall status endpoints.
      required:
      - grant_id
      - claim_id
      properties:
        claim_id:
          type: string
        grant_id:
          type: string
    PaywallStatusResponse:
      type: object
      description: Response for the paywall status endpoints.
      required:
      - claim_id
      - status
      - amount_sats
      - expires_at
      properties:
        access_token:
          type:
          - string
          - 'null'
          description: |-
            Present only on the poll that settles the claim (see
            [`PaywallProofResponse::access_token`]).
        amount_sats:
          type: integer
          format: int64
          description: Settled amount in sats.
        claim_id:
          type: string
        expires_at:
          type: string
          description: Claim expiry, RFC 3339.
        status:
          type: string
          description: '`pending` | `succeeded` | `expired`.'
    ProxyOfferRequest:
      type: object
      required:
      - offer
      properties:
        access_token:
          type:
          - string
          - 'null'
          description: |-
            Anonymous share-link viewers on a priced link only: the bearer access
            token from their settled Lightning paywall claim, as at join.
        grant_id:
          type:
          - string
          - 'null'
          description: |-
            Anonymous share-link viewers only: the grant id from their watch link.
            Present exactly when no member JWT is sent; ignored otherwise.
        id:
          type:
          - string
          - 'null'
          description: |-
            Accepted and **ignored**. Present only so a client that sends the field it
            sends on the direct path is not rejected; the viewer id is derived from the
            authenticated Matrix user, never taken from the body.
        offer:
          description: The viewer's SDP offer, forwarded verbatim.
        source_id:
          type:
          - string
          - 'null'
          description: Which source to attach to immediately. Optional, as on the direct path.
        viewer_token:
          type:
          - string
          - 'null'
          description: |-
            Anonymous share-link viewers only: the switch viewer token their
            `public-join` minted. Carried in the body (not the `Authorization`
            header) because these callers hold no header credential, and routing
            on its presence keeps the member extractor untouched.
    ProxyOfferResponse:
      type: object
      required:
      - id
      - answer
      properties:
        answer:
          description: The node's SDP answer, forwarded verbatim.
        id:
          type: string
          description: The viewer id mm-core assigned. Echoed so a client can keep using it.
    PublicJoinRequest:
      type: object
      description: |-
        Request body for `POST /streams/{id}/public-join`, and likewise for
        `POST /streams/{id}/public-view` and
        `POST /recordings/{recording_id}/public-view`.
      required:
      - grant_id
      properties:
        access_token:
          type:
          - string
          - 'null'
          description: |-
            Bearer access token minted when a Lightning paywall claim for
            this grant settled (V059). Only needed for priced targets;
            the server stores just its SHA-256 hash.
        grant_id:
          type: string
          description: The share grant id from the share link.
    RecordingPaywallPriceResponse:
      type: object
      description: Response for `PUT /recordings/{recording_id}/paywall`.
      required:
      - recording_id
      properties:
        paywall_price_sats:
          type:
          - integer
          - 'null'
          format: int64
        recording_id:
          type: string
    RecordingResponse:
      type: object
      description: Public representation of a recording for client API consumers.
      required:
      - id
      - stream_id
      - host_user_id
      - media_type
      - status
      - created_at
      properties:
        ad_policy:
          description: |-
            Ad policy for VoD playback (pre-roll, mid-rolls, post-roll).
            `None` when advertising is disabled or viewer has ad-free perk.
        caption_urls:
          type: object
          description: |-
            Caption track URLs by language code (`{ "en": ".../rec_x.en.vtt" }`).
            One entry per `ready` track row (`mm_recording_captions`, V057) with
            a non-null storage key — a listed language always has a servable
            `.vtt` sidecar on nginx's `/_mm/recordings/` route (`text/vtt`),
            mirroring the `mp4_url` gating (never hand out a URL that 404s).
            Empty when the recording is not `ready`, is not `local`, or has no
            tracks yet. Render as `<track kind="subtitles">` (web), AVPlayer
            sidecars (iOS), or `SingleSampleMediaSource` (Android).
          additionalProperties:
            type: string
          propertyNames:
            type: string
        created_at:
          type: string
        duration_ms:
          type:
          - integer
          - 'null'
          format: int64
        host_user_id:
          type: string
        id:
          type: string
        media_type:
          type: string
        min_tier_level:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Per-content tier gate (V026). `None` = free; `Some(n)` = requires
            an active subscription at level >= n. Inherited from the parent
            stream's gate at recording-create time. Clients use this to show a
            paywall before playback.
        mp4_url:
          type:
          - string
          - 'null'
          description: |-
            H.264/AAC faststart MP4 rendition transcoded by mm-switch at
            finalise (V030). Present only when the transcode is ready;
            clients should prefer it over `playback_url` for native
            players (AVPlayer / ExoPlayer / <video>) and fall back to the
            WebM `playback_url` when absent.
        mxc_url:
          type:
          - string
          - 'null'
        paywall_price_sats:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Anonymous share-link Lightning price in sats (V059). `None` = no
            anonymous paywall; `Some(n)` = a share-link viewer must settle an
            n-sat invoice before the playable URLs are served (until then
            `public-view` withholds them). Member viewers are unaffected.
        playback_url:
          type:
          - string
          - 'null'
          description: |-
            Preferred playback URL: signed CDN URL if available, otherwise
            the raw MXC URL, otherwise `None`.
        size_bytes:
          type:
          - integer
          - 'null'
          format: int64
        status:
          type: string
        stream_id:
          type: string
        summaries:
          type: object
          description: |-
            Per-language summaries (`{ "en": "..." }`), from `summary_text` on
            the same V057 rows. Empty until the post-finalise summary step writes
            them.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        summary:
          type:
          - string
          - 'null'
          description: |-
            Source-language summary convenience: the `"en"` entry of `summaries`
            when present, else the first language alphabetically. Clients that
            render one summary (web, dashboard, mobile) read this; clients with
            a language picker read `summaries`.
        thumbnail_url:
          type:
          - string
          - 'null'
          description: |-
            Poster frame URL extracted at finalise time (`-ss 3s` then a
            0.5s fallback). Only present for `local` storage with status
            `ready` and a `.webm` file (mm-switch path); LiveKit egress
            MP4s don't get a thumbnail right now.
        title:
          type:
          - string
          - 'null'
    RecordingShareGrantResponse:
      type: object
      description: |-
        Response for `POST /recordings/{recording_id}/share-grants`. The
        recording counterpart of [`ShareGrantResponse`], which names a
        `stream_id` and so cannot be reused here.
      required:
      - grant_id
      - recording_id
      - expires_at
      - link_access
      properties:
        expires_at:
          type: string
          description: Grant expiry, RFC 3339.
        grant_id:
          type: string
        link_access:
          type: string
        paywall_price_sats:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            The recording's anonymous Lightning paywall price in sats
            (V059), as currently configured; `null` for a free link.
        recording_id:
          type: string
    RecordingsResponse:
      type: object
      description: Response for `GET /rooms/{room_id}/recordings`.
      required:
      - recordings
      - has_more
      properties:
        has_more:
          type: boolean
        recordings:
          type: array
          items:
            $ref: '#/components/schemas/RecordingResponse'
    RerunCaptionsResponse:
      type: object
      description: |-
        The re-run acknowledgement. The job itself stays asynchronous:
        mm-caption-worker picks the reset row up on its next poll.
      required:
      - ok
      properties:
        ok:
          type: boolean
    RevokeShareGrantResponse:
      type: object
      description: Response for `DELETE /streams/{id}/share-grants/{grant_id}`.
      required:
      - revoked
      properties:
        revoked:
          type: boolean
    RoomStreamsResponse:
      type: object
      description: Response for `GET /rooms/{room_id}/streams`.
      required:
      - streams
      properties:
        streams:
          type: array
          items:
            $ref: '#/components/schemas/StreamResponse'
    RotateKeyResponse:
      type: object
      description: Response for `POST /streams/{id}/rotate-key`.
      required:
      - stream_id
      - e2ee
      properties:
        e2ee:
          $ref: '#/components/schemas/E2eeStreamInfo'
        stream_id:
          type: string
    SetPaywallPriceRequest:
      type: object
      description: |-
        Request body for `PUT /streams/{id}/paywall` and
        `PUT /recordings/{recording_id}/paywall`.
      properties:
        paywall_price_sats:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Anonymous share-link price in sats. `null` (or absent) clears
            the paywall; a value must be positive.
    SetStreamCaptionsRequest:
      type: object
      description: Body for `PUT /streams/{id}/captions`.
      required:
      - opt_in
      properties:
        opt_in:
          $ref: '#/components/schemas/CaptionOverride'
    SetStreamTranscodeRequest:
      type: object
      description: Body for `PUT /streams/{id}/transcode`.
      required:
      - opt_in
      properties:
        opt_in:
          $ref: '#/components/schemas/TranscodeOverride'
          description: '`on` also clears an operator release; `inherit` and `off` do not.'
    ShareGrantResponse:
      type: object
      description: Response for `POST /streams/{id}/share-grants`.
      required:
      - grant_id
      - stream_id
      - expires_at
      - link_access
      properties:
        expires_at:
          type: string
          description: Grant expiry, RFC 3339.
        grant_id:
          type: string
        link_access:
          type: string
        paywall_price_sats:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            The stream's anonymous Lightning paywall price in sats (V059),
            as currently configured; `null` for a free link.
        stream_id:
          type: string
    StartRecordingResponse:
      type: object
      required:
      - recording_id
      - egress_id
      - status
      - segment
      properties:
        egress_id:
          type: string
        recording_id:
          type: string
        segment:
          type: integer
          format: int64
        status:
          type: string
    StreamCaptionsResponse:
      type: object
      description: |-
        A broadcast's captions setting and what it resolves to. English source
        tracks only; there is no translation-target / MT surface here.
      required:
      - opt_in
      - default_opt_in
      - wants_captions
      properties:
        default_opt_in:
          type: boolean
          description: The host's default for their broadcasts (`PUT /creator/me/captions`).
        opt_in:
          $ref: '#/components/schemas/CaptionOverride'
          description: This broadcast's setting. `inherit` follows `default_opt_in`.
        wants_captions:
          type: boolean
          description: |-
            Whether the host wants captions for this broadcast. Necessary, not
            sufficient: the end path only enqueues the caption job for local
            recordings of an opted-in broadcast.
    StreamPaywallPriceResponse:
      type: object
      description: Response for `PUT /streams/{id}/paywall`.
      required:
      - stream_id
      properties:
        paywall_price_sats:
          type:
          - integer
          - 'null'
          format: int64
        stream_id:
          type: string
    StreamResponse:
      type: object
      description: Response for `GET /streams/{id}`.
      required:
      - id
      - room_id
      - host_user_id
      - media_type
      - status
      - participant_count
      - started_at
      properties:
        ended_at:
          type:
          - string
          - 'null'
        host_user_id:
          type: string
        id:
          type: string
        media_type:
          type: string
        min_tier_level:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Per-content tier gate (V026). `None` = free; `Some(n)` = requires
            an active subscription at level >= n. Clients use this to show a
            paywall before connecting.
        participant_count:
          type: integer
          format: int32
        paywall_price_sats:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Anonymous share-link Lightning price in sats (V059). `None` = no
            anonymous paywall; `Some(n)` = a share-link viewer must settle an
            n-sat invoice before `public-join` admits them. Member viewers
            are unaffected. Clients show the paywall sheet from this.
        room_id:
          type: integer
          format: int64
        started_at:
          type: string
        state_event_id:
          type:
          - string
          - 'null'
          description: |-
            STARTED `com.matrixmedia.stream` state-event id; clients anchor
            the stream-comments thread on this. None for legacy streams.
        status:
          type: string
        title:
          type:
          - string
          - 'null'
    StreamTranscodeResponse:
      type: object
      description: A broadcast's transcode (GPU ladder) setting and what it resolves to.
      required:
      - opt_in
      - default_opt_in
      - released
      - wants_transcoder
      properties:
        default_opt_in:
          type: boolean
          description: The host's default for their broadcasts (`PUT /creator/me/transcode`).
        opt_in:
          $ref: '#/components/schemas/TranscodeOverride'
          description: This broadcast's setting. `inherit` follows `default_opt_in`.
        released:
          type: boolean
          description: |-
            An operator released this broadcast's transcoder. It stays released until
            the host sets `opt_in` to `on` again; changing the default does not clear it.
        wants_transcoder:
          type: boolean
          description: |-
            Whether the host wants a transcoder for this broadcast. Necessary, not
            sufficient: one is only provisioned for a paying broadcaster whose live
            programme is on air and whose balance covers it.
    TranscodeOverride:
      type: string
      description: The per-broadcast setting (`mm_streams.transcode_opt_in`).
      enum:
      - inherit
      - on
      - off
    TurnCredentialsResponse:
      type: object
      description: Response body for `GET /turn-credentials`.
      required:
      - urls
      - username
      - credential
      - ttl_secs
      properties:
        credential:
          type: string
          description: '`base64(HMAC-SHA1(shared_secret, username))`.'
        expires_at:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Unix second the credential stops working. Dynamic-userdb mode only
            (`None` on the legacy path): enforcement is row presence, swept by the
            60s reaper, so clients should refetch by `expires_at - 60`.
          minimum: 0
        ttl_secs:
          type: integer
          format: int64
          description: Seconds until the credential expires (also embedded in `username`).
          minimum: 0
        urls:
          type: array
          items:
            type: string
          description: |-
            TURN/STUN ICE-server URIs the credential is valid for. Empty when the
            server has no `MM_TURN_URLS` configured — the client then keeps its own
            URL constant and applies only `username` / `credential`.

            HMAC-REST mode: the credential below is a short-lived HMAC. Dynamic-userdb
            mode: it is a per-call row password (stored only as `hmackey` server-side).
        username:
          type: string
          description: 'coturn REST username: `"<unix_expiry>[:<mxid>]"`.'
    ViewerCountResponse:
      type: object
      required:
      - stream_id
      - viewers
      properties:
        stream_id:
          type: string
        viewers:
          type: integer
          format: int32
          description: |-
            Connected viewers on this stream, summed across the origin and every
            fan-out node. **A count, not a list** — the ids embed Matrix user ids, and
            publishing them is what FR-349b closed.
          minimum: 0
  securitySchemes:
    admin_token:
      type: http
      scheme: bearer
      description: Shared secret configured via `MM_ADMIN_TOKEN` env var. Admin API listens on a separate port (default 6168) and is localhost-only by default.
    hs_token:
      type: http
      scheme: bearer
      description: Homeserver token (`hs_token`) from the appservice registration YAML. The homeserver sends this when pushing transaction batches.
    mm_jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'MM session JWT obtained via `POST /auth/token`. HS256-signed, 15-minute TTL. Claims include `iss: "matrixmedia"`, `aud: "mm-api"`, `sub: "<matrix_user_id>"`.'
tags:
- name: auth
  description: Authentication -- exchange Matrix OpenID tokens for MM JWTs
- name: streams
  description: Stream lifecycle -- create, join, leave, end, resume, query
- name: recordings
  description: Recording start/stop, listing, retrieval, and deletion
